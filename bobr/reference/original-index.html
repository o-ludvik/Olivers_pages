<title>Bobří trénink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one column – topic grid, then a ladder of tasks from easy to master, task sheet on top */
:root {
  --bg: #E6F2EE;
  --surface: #FFFFFF;
  --surface-2: #F1F8F5;
  --ink: #1D3634;
  --muted: #587370;
  --line: #CFE2DC;
  --river: #2C88B0;
  --river-soft: #D3EBF4;
  --wood: #94592F;
  --wood-soft: #F3E3D4;
  --leaf: #2F8A50;
  --leaf-soft: #D8F0E0;
  --sun: #E9A72B;
  --bad: #C9503A;
  --bad-soft: #F9E0DA;
  --shadow: 0 2px 0 rgba(29,54,52,.08), 0 8px 24px rgba(29,54,52,.08);
  --f-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F201E; --surface: #17302C; --surface-2: #1C3833; --ink: #E4F1ED; --muted: #9BB6B0; --line: #2A4A44;
    --river: #55B2DA; --river-soft: #173B4A; --wood: #D09363; --wood-soft: #3A2B1F; --leaf: #5CC07F; --leaf-soft: #1C3F2A;
    --sun: #F4C255; --bad: #EB7C64; --bad-soft: #452621; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F201E; --surface: #17302C; --surface-2: #1C3833; --ink: #E4F1ED; --muted: #9BB6B0; --line: #2A4A44;
  --river: #55B2DA; --river-soft: #173B4A; --wood: #D09363; --wood-soft: #3A2B1F; --leaf: #5CC07F; --leaf-soft: #1C3F2A;
  --sun: #F4C255; --bad: #EB7C64; --bad-soft: #452621; --shadow: 0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.1; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--river); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 22px; background: none; border: 0; padding: 0; }
.brand svg { width: 38px; height: 38px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.star { color: var(--sun); }

/* home */
.hero { display: grid; gap: 14px; padding-block: 8px 20px; }
.hero h1 { font-size: clamp(38px, 8vw, 60px); font-weight: 800; letter-spacing: -.5px; }
.hero h1 span { color: var(--river); }
.hero p { margin: 0; color: var(--muted); max-width: 52ch; font-size: 18px; }
.name-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.name-row label { font-weight: 800; }
.name-row input { font: inherit; font-weight: 700; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; flex: 1 1 200px; max-width: 320px; }
.grades { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 8px; }
.grade { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 10px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
.grade:hover { transform: translateY(-3px); border-color: var(--river); }
.grade .num { font-family: var(--f-display); font-weight: 800; font-size: 46px; line-height: 1; color: var(--wood); }
.grade .cat { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--muted); }
.grade h2 { font-size: 26px; }
.meter { height: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; transition: width .4s ease; }
.grade .meta { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* map */
.map-head { display: grid; gap: 6px; margin-bottom: 18px; }
.map-head h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 800; }
.map-head p { margin: 0; color: var(--muted); }
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0 22px; }
.level { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 18px 18px 22px; margin-bottom: 18px; box-shadow: var(--shadow); overflow: hidden; }
.level-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.level h2 { font-size: 24px; }
.level .lv { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; font-weight: 800; color: var(--river); }
.level .count { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.stations { position: relative; display: flex; flex-wrap: wrap; gap: 18px 22px; margin-top: 16px; padding: 14px 6px 4px; }
.stations::before { content: ""; position: absolute; left: 0; right: 0; top: 50px; height: 18px; background: var(--river-soft); border-radius: 999px; }
.station { position: relative; display: grid; justify-items: center; gap: 6px; width: 96px; background: none; border: 0; padding: 0; }
.log { width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 28px; background: var(--wood-soft); color: var(--wood); border: 4px solid var(--wood); box-shadow: inset 0 0 0 6px var(--wood-soft), inset 0 0 0 8px color-mix(in srgb, var(--wood) 35%, transparent); transition: transform .15s ease; }
.station:hover .log { transform: scale(1.07) rotate(-4deg); }
.station.done .log { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); box-shadow: none; }
.station.revealed .log { background: var(--surface-2); border-color: var(--muted); color: var(--muted); box-shadow: none; }
.station .st-name { font-size: 14px; font-weight: 700; text-align: center; line-height: 1.25; }
.stars { font-size: 15px; letter-spacing: 1px; color: var(--line); }
.stars b { color: var(--sun); font-weight: 400; }
.level.locked .stations { opacity: .4; filter: grayscale(1); pointer-events: none; }
.lock-note { margin-top: 10px; font-weight: 700; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
.badge { background: var(--surface); border: 2px dashed var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 4px; justify-items: start; }
.badge.got { border-style: solid; border-color: var(--sun); }
.badge .b-ico { width: 34px; height: 34px; }
.badge strong { font-family: var(--f-display); font-size: 17px; }
.badge span { font-size: 13px; color: var(--muted); line-height: 1.3; }
.section-title { font-size: 22px; margin: 28px 0 4px; }

/* task */
.task { background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 22px; box-shadow: var(--shadow); display: grid; gap: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 3px 10px; border-radius: 999px; background: var(--river-soft); color: var(--river); }
.chip.wood { background: var(--wood-soft); color: var(--wood); }
.task h1 { font-size: clamp(26px, 5vw, 34px); font-weight: 800; }
.task .text { max-width: 62ch; }
.task .text p { margin: 0 0 10px; }
.visual { background: var(--surface-2); border-radius: 18px; padding: 14px; overflow-x: auto; display: flex; justify-content: center; }
.visual svg { max-width: 100%; height: auto; display: block; }
.visual table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
.plan { border-collapse: collapse; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
.plan td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); }
.plan td:last-child { color: var(--muted); font-weight: 700; }
.grade.expert { border-color: var(--sun); background: linear-gradient(160deg, color-mix(in srgb, var(--sun) 16%, var(--surface)), var(--surface) 60%); }
.grade.expert .num { font-size: 34px; color: var(--sun); }
.grade.secret { border-style: dashed; box-shadow: none; cursor: default; opacity: .85; }
.grade.secret:hover { transform: none; border-color: var(--line); }
.grade.secret .num { font-size: 34px; color: var(--muted); }
.unlock { background: color-mix(in srgb, var(--sun) 20%, var(--surface)); border: 2px solid var(--sun); border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; }
.unlock h3 { font-size: 22px; }
.unlock p { margin: 0; }
.code { font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: 17px; background: var(--surface-2); border-left: 4px solid var(--river); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; white-space: pre; overflow-x: auto; }
.visual th, .visual td { padding: 6px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.visual th { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.question { font-weight: 800; font-size: 19px; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; display: flex; gap: 10px; align-items: center; }
.options.pics { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.options.pics .opt svg { display: block; max-width: 100%; height: auto; border-radius: 6px; }
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--f-display); font-weight: 800; }
.opt.sel { border-color: var(--river); background: var(--river-soft); }
.opt.sel .k { background: var(--river); color: var(--surface); }
.answer-input { font: inherit; font-weight: 800; font-size: 22px; padding: 10px 16px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; max-width: 260px; text-transform: uppercase; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { border: 0; border-radius: 16px; padding: 12px 22px; font-weight: 800; font-size: 17px; background: var(--river); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--river) 60%, #000); transition: transform .1s ease, box-shadow .1s ease; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in srgb, var(--river) 60%, #000); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.green { background: var(--leaf); box-shadow: 0 4px 0 color-mix(in srgb, var(--leaf) 60%, #000); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
.back { background: none; border: 0; font-weight: 800; color: var(--muted); padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; }
.feedback { border-radius: 18px; padding: 14px 16px; display: grid; gap: 8px; }
.feedback.ok { background: var(--leaf-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback.info { background: var(--surface-2); }
.feedback h3 { font-size: 22px; }
.feedback.ok h3 { color: var(--leaf); }
.feedback.no h3 { color: var(--bad); }
.feedback p { margin: 0; }
.big-stars { font-size: 30px; letter-spacing: 4px; color: var(--line); }
.big-stars b { color: var(--sun); font-weight: 400; display: inline-block; animation: pop .5s ease both; }
.big-stars b:nth-child(2) { animation-delay: .12s; } .big-stars b:nth-child(3) { animation-delay: .24s; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.tries { font-size: 14px; color: var(--muted); font-weight: 700; }
footer { margin-top: 36px; font-size: 13px; color: var(--muted); max-width: 70ch; }
footer a { color: var(--river); }
.reset { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.btn.finish { background: var(--wood); box-shadow: 0 4px 0 color-mix(in srgb, var(--wood) 60%, #000); padding: 8px 16px; font-size: 15px; }
#modal { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: 16px; }
#modal[hidden] { display: none; }
.m-card { background: var(--surface); border-radius: 24px; padding: 24px; max-width: 460px; width: 100%; display: grid; gap: 14px; box-shadow: var(--shadow); }
.m-card h2 { font-size: 28px; }
.m-card p { margin: 0; }
.m-sum { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px; font-variant-numeric: tabular-nums; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
.shake { animation: shake .35s ease; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 480px) { .station { width: 84px; } .log { width: 64px; height: 64px; font-size: 24px; } .stations::before { top: 44px; } .task { padding: 16px; } }
/* --- Bobří trénink: témata místo tříd --- */
.stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 8px; }
.topic { text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px; display: grid; gap: 8px; align-content: start; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
.topic:hover { transform: translateY(-3px); border-color: var(--river); }
.topic .t-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--wood-soft); color: var(--wood); font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.topic h2 { font-size: 23px; }
.topic .t-desc { color: var(--muted); font-size: 15px; line-height: 1.4; }
.topic .meta { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.topic.complete { border-color: var(--leaf); }
.diff { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 2px 9px; border-radius: 999px; }
.diff.d1 { background: var(--leaf-soft); color: var(--leaf); }
.diff.d2 { background: var(--river-soft); color: var(--river); }
.diff.d3 { background: var(--wood-soft); color: var(--wood); }
.diff.d4 { background: color-mix(in srgb, var(--sun) 22%, var(--surface)); color: color-mix(in srgb, var(--sun) 70%, var(--ink)); }
.tasklist { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow); }
.trow:hover { border-color: var(--river); }
.trow .log { width: 52px; height: 52px; font-size: 22px; }
.trow.done .log { background: var(--leaf-soft); border-color: var(--leaf); color: var(--leaf); box-shadow: none; }
.trow.revealed .log { background: var(--surface-2); border-color: var(--muted); color: var(--muted); box-shadow: none; }
.trow .tr-main { display: grid; gap: 4px; min-width: 0; }
.trow .tr-title { font-family: var(--f-display); font-weight: 800; font-size: 19px; line-height: 1.15; }
.trow .tr-sub { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); font-weight: 700; }
.ladder { display: flex; gap: 4px; align-items: flex-end; }
.ladder i { width: 6px; border-radius: 3px; background: var(--line); }
.ladder i.on { background: var(--wood); }
.explain { background: var(--surface-2); border-radius: 18px; padding: 14px 16px; display: grid; gap: 10px; }
.explain h3 { font-size: 20px; }
.explain ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.explain ol li::marker { font-family: var(--f-display); font-weight: 800; color: var(--river); }
.explain .note { border-left: 4px solid var(--sun); padding: 4px 0 4px 12px; }
.explain .note b { color: color-mix(in srgb, var(--sun) 60%, var(--ink)); }
.explain .why { border-left: 4px solid var(--river); padding: 4px 0 4px 12px; color: var(--muted); }
.trap { background: color-mix(in srgb, var(--sun) 18%, var(--surface)); border-radius: 12px; padding: 8px 12px; }
.newbadge { display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--sun) 20%, var(--surface)); border: 2px solid var(--sun); border-radius: 16px; padding: 10px 14px; color: var(--sun); }
.newbadge strong { color: var(--ink); font-family: var(--f-display); font-size: 18px; }
.newbadge span { color: var(--ink); }
.cardsrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.big { font-family: var(--f-display); font-size: 24px; letter-spacing: 3px; }
.newbadge .b-ico { width: 30px; height: 30px; flex: none; }
</style>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="bar">
    <button class="brand" id="homeBtn" aria-label="Zpět na úvod">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="15" fill="var(--wood)"/><circle cx="9" cy="10" r="5" fill="var(--wood)"/><circle cx="31" cy="10" r="5" fill="var(--wood)"/><circle cx="14" cy="19" r="2.4" fill="var(--surface)"/><circle cx="26" cy="19" r="2.4" fill="var(--surface)"/><ellipse cx="20" cy="26" rx="5" ry="3.5" fill="var(--wood-soft)"/><rect x="17" y="28" width="6" height="5" rx="1" fill="var(--surface)"/></svg>
      Bobří trénink
    </button>
    <div id="barRight" class="actions"></div>
  </div>
  <main id="app"></main>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-label="Odeslání výsledků"><div class="m-card"></div></div>
  <footer>

<script>
/* Řešení jsou zašifrovaná. Úlohy se upravují ve zdrojové verzi (src/index.src.html). */
const TOPICS = [
  { id: "razeni", name: "Řazení", ico: "↕", desc: "Prohazování karet, kola řazení a počítání výměn." },
  { id: "cykly", name: "Cykly a programy", ico: "↻", desc: "Kolikrát se příkaz opakuje, proměnné a robot." },
  { id: "dvojkova", name: "Dvojková soustava", ico: "01", desc: "Lampy s hodnotami 1, 2, 4, 8, 16 a zápis čísel." },
  { id: "sifry", name: "Šifry", ico: "Aa", desc: "Posouvání písmen, luštění a hledání klíče." },
  { id: "hromady", name: "Hromady a fronty", ico: "≡", desc: "Bere se shora, nebo zepředu? Zásobník a fronta." },
  { id: "logika", name: "Logika a vzory", ico: "?!", desc: "Kdo lže, kdo kde bydlí a co přijde dál." },
  { id: "cesty", name: "Cesty a sítě", ico: "⌘", desc: "Nejkratší cesta, šíření zprávy a propojování." },
  { id: "hledani", name: "Hledání a půlení", ico: "½", desc: "Jak najít číslo nebo kládu na co nejméně pokusů." },

const TASKS = [{"id":"r1","topic":"razeni","level":1,"title":"Kdo je nejmenší?","text":"<p>Bobři se změřili, ale vždy jen dva najednou:</p><ul><li>Ota je vyšší než Ema.</li><li>Ema je vyšší než Ivo.</li><li>Lea je vyšší než Ota.</li></ul>","question":"Kdo je nejmenší?","type":"choice","options":["Ota","Ema","Ivo","Lea"],"hint":"Zkus bobry seřadit do řady od nejvyššího. Kdo je pod Emou?"},{"id":"r2","topic":"razeni","level":1,"title":"Jeden průchod","text":"<p>Bobr jde po kartách <b>zleva doprava</b> a porovnává vždy <b>dva sousedy</b>. Když je levá karta větší, prohodí je. Pak se posune o jedno místo doprava.</p>","visual":["cards",[4,1,3,2]],"question":"Jak budou karty ležet po jednom průchodu zleva doprava?","type":"choice","options":["1 2 3 4","1 3 2 4","1 4 3 2","3 1 2 4"],"hint":"Piš si řadu po každém porovnání. Začni dvojicí 4 a 1."},{"id":"r3","topic":"razeni","level":2,"title":"Výběr nejmenší karty","text":"<p>Bobr řadí karty <b>výběrem</b>. V každém kole najde mezi neseřazenými kartami tu nejmenší a <b>prohodí ji</b> s první neseřazenou kartou. Ostatní karty se nehýbou.</p>","visual":["cards",[5,8,2,9,4]],"question":"Jak budou karty ležet po 1. kole?","type":"choice","options":["2 8 5 9 4","2 5 8 9 4","2 4 5 8 9","8 5 2 9 4"],"hint":"Najdi nejmenší kartu. Se kterou kartou se prohodí? Jen tyhle dvě se pohnou."},{"id":"r4","topic":"razeni","level":2,"title":"Dvě kola","text":"<p>Bobr zase řadí <b>výběrem</b>: v každém kole najde nejmenší neseřazenou kartu a prohodí ji s první neseřazenou kartou.</p>","visual":["cards",[6,3,8,1,5]],"question":"Jak budou karty ležet po 2. kole?","type":"choice","options":["1 3 5 6 8","1 3 8 6 5","1 6 3 8 5","1 3 6 8 5"],"hint":"Po 1. kole je 1 na začátku. Ve 2. kole hledej nejmenší kartu jen mezi ostatními. Kde leží?"},{"id":"r5","topic":"razeni","level":2,"title":"Výměny sousedů","text":"<p>Karty se mají seřadit od nejmenší po největší. Smí se ale jen <b>prohodit dvě sousední karty</b>.</p>","visual":["cards",[2,4,1,3]],"question":"Kolik takových výměn je potřeba nejméně?","type":"number","hint":"Spočítej dvojice karet, které stojí ve špatném pořadí (větší je vlevo od menší)."},{"id":"r6","topic":"razeni","level":3,"title":"Kolik průchodů?","text":"<p>Bobr řadí jako v úloze „Jeden průchod“: jde zleva doprava a prohazuje sousedy, když je levá karta větší. Průchody opakuje tak dlouho, dokud v nějakém průchodu <b>neprohodí nic</b>.</p>","visual":["cards",[3,5,1,4,2]],"question":"Kolik průchodů celkem udělá? (Počítej i ten poslední, ve kterém už nic neprohodí.)","type":"number","hint":"Po každém průchodu si napiš celou řadu. Největší číslo vždy doputuje na konec."},{"id":"r7","topic":"razeni","level":4,"title":"Velké řazení","text":"<p>Šest karet se má seřadit od nejmenší po největší jen <b>výměnami sousedních karet</b>.</p>","visual":["cards",[3,6,1,5,2,4]],"question":"Kolik výměn je potřeba nejméně?","type":"number","hint":"U každé karty spočítej, kolik menších karet leží napravo od ní. Pak čísla sečti."},{"id":"c1","topic":"cykly","level":1,"title":"Tleskací program","text":"<p>Co je uvnitř příkazu <b>opakuj</b>, provede se tolikrát, kolikrát se píše.</p><div class=\"code\">opakuj 3×:\n    tleskni\n    tleskni</div>","question":"Kolikrát bobr tleskne?","type":"number","hint":"Kolikrát tleskne v jednom opakování? A kolik je opakování?"},{"id":"c2","topic":"cykly","level":1,"title":"Přidávání klád","text":"<p>Na hrázi leží na začátku <b>2 klády</b>. Bobři pak provedou:</p><div class=\"code\">opakuj 3×:\n    přidej 4 klády</div>","question":"Kolik klád bude na hrázi na konci?","type":"number","hint":"Napiš si: začátek 2, po 1. opakování…, po 2. opakování…"},{"id":"c3","topic":"cykly","level":2,"title":"Zdvojování","text":"<p>Na začátku má hráz <b>1 kládu</b>. Bobři pak provedou:</p><div class=\"code\">opakuj 5×:\n    počet klád = počet klád × 2</div>","question":"Kolik klád bude mít hráz na konci?","type":"number","hint":"Udělej si tabulku: začátek 1, po 1. opakování 2, po 2. opakování…"},{"id":"c4","topic":"cykly","level":2,"title":"Cyklus v cyklu","text":"<p>Bobři tančí podle programu:</p><div class=\"code\">opakuj 3×:\n    dupni\n    opakuj 2×:\n        tleskni</div>","question":"Kolik zvuků (dupnutí a tlesknutí dohromady) bobři udělají?","type":"number","hint":"Kolik zvuků je v jednom velkém kole? Pak to vynásob počtem velkých kol."},{"id":"c5","topic":"cykly","level":2,"title":"Krabičky a a b","text":"<p>V programu jsou dvě krabičky (proměnné) <b>a</b> a <b>b</b>. Řádky se provádějí shora dolů.</p><div class=\"code\">a = 2\nb = 5\na = a + b\nb = a + b\na = b − a</div>","question":"Co je na konci v krabičkách?","type":"choice","options":["a = 5, b = 12","a = 7, b = 12","a = 5, b = 7","a = 2, b = 5"],"hint":"Po každém řádku si zapiš obě krabičky. Vždy použij číslo, které tam je TEĎ."},{"id":"c6","topic":"cykly","level":3,"title":"Robot ve smyčce","text":"<p>Robot stojí na <b>S</b> a dívá se <b>nahoru</b>. „Krok“ = jedno políčko dopředu. „Vpravo“ = otočí se na místě doprava (nepohne se).</p><div class=\"code\">opakuj 3×:\n    krok\n    krok\n    vpravo</div>","visual":["grid",[["A",2,2],["B",4,4],["C",2,4],["D",0,2]]],"question":"Na kterém písmenu robot skončí?","type":"choice","options":["A","B","C","D"],"hint":"Po každém otočení si poznamenej, kam se robot dívá: nahoru → doprava → dolů → doleva."},{"id":"c7","topic":"cykly","level":4,"title":"Návod sám na sebe","text":"<p>Bobr má návod <b>postav(n)</b>. Když je n = 0, nedělá nic. Jinak udělá tohle:</p><div class=\"code\">postav(n):\n    polož 1 kládu\n    postav(n − 1)\n    postav(n − 1)</div>","question":"Kolik klád položí příkaz postav(4)?","type":"number","hint":"Začni od malých čísel: postav(1) = 1 kláda. Kolik položí postav(2)? A postav(3)?"},{"id":"d1","topic":"dvojkova","level":1,"title":"Hodnoty lamp","text":"<p>Bobři si posílají čísla čtyřmi lampami. Každá lampa má svou hodnotu (napsanou nad ní). Číslo zjistíš, když <b>sečteš hodnoty rozsvícených lamp</b>.</p>","visual":["lamps",{"values":[8,4,2,1],"rows":[[0,1,0,0]]}],"question":"Jaké číslo lampy ukazují?","type":"number","hint":"Svítí jen jedna lampa. Jakou má hodnotu?"},{"id":"d2","topic":"dvojkova","level":1,"title":"Dvě rozsvícené","text":"<p>Lampy mají hodnoty <b>8, 4, 2, 1</b> (zleva doprava). Sečti hodnoty rozsvícených lamp.</p>","visual":["lamps",{"values":[8,4,2,1],"rows":[[1,0,1,0]]}],"question":"Jaké číslo lampy ukazují?","type":"number","hint":"Které dvě lampy svítí? Sečti jejich hodnoty."},{"id":"d3","topic":"dvojkova","level":2,"title":"Signální lampy","text":"<p>Lampy mají hodnoty <b>8, 4, 2, 1</b>. Tentokrát hodnoty napsané nejsou.</p>","visual":["lamps",{"rows":[[1,1,0,1]]}],"question":"Jaké číslo lampy ukazují?","type":"number","hint":"Nad každou lampu si napiš hodnotu: 8, 4, 2, 1. Pak sečti ty, které svítí."},{"id":"d4","topic":"dvojkova","level":2,"title":"Zjisti hodnoty sám","text":"<p>Bobři ukázali dvě čísla. Z nich zjisti, jakou hodnotu má která lampa.</p>","visual":["lamps",{"rows":[[0,0,1,1,"= 3"],[1,0,0,0,"= 8"],[0,1,1,0,"= ?"]]}],"question":"Jaké číslo ukazuje poslední řádek?","type":"number","hint":"Z druhého řádku víš hodnotu první lampy. Z prvního řádku poznáš, že dvě pravé lampy dají dohromady 3."},{"id":"d5","topic":"dvojkova","level":3,"title":"Zapiš jedenáctku","text":"<p>Lampy mají hodnoty <b>8, 4, 2, 1</b>. Bobr chce ukázat číslo <b>11</b>.</p>","question":"Které lampy musí rozsvítit? (● svítí, ○ nesvítí)","type":"choice","options":["● ○ ● ●","● ● ○ ●","○ ● ● ●","● ○ ○ ●"],"hint":"Začni největší lampou. Vejde se 8 do 11? Kolik pak zbývá?"},{"id":"d6","topic":"dvojkova","level":3,"title":"Pět lamp","text":"<p>Bobři přidali pátou lampu. Hodnoty jsou zleva <b>16, 8, 4, 2, 1</b>.</p>","question":"Jak ukážou číslo 27?","type":"choice","options":["● ○ ● ● ●","● ● ○ ● ●","● ● ● ○ ●","○ ● ● ● ●"],"hint":"27 − 16 = ? Pokračuj s dalšími lampami od největší."},{"id":"d7","topic":"dvojkova","level":3,"title":"Největší číslo","text":"<p>Bobři mají pět lamp s hodnotami <b>16, 8, 4, 2, 1</b>.</p>","question":"Jaké největší číslo dokážou ukázat?","type":"number","hint":"Největší číslo dostaneš, když svítí všechno."},{"id":"d8","topic":"dvojkova","level":4,"title":"Kolik čísel?","text":"<p>Bobři mají <b>šest lamp</b> (hodnoty 32, 16, 8, 4, 2, 1). Číslo 0 ukážou tak, že nesvítí nic.</p>","question":"Kolik různých čísel dokážou šesti lampami ukázat (včetně nuly)?","type":"number","hint":"Jedna lampa: 2 možnosti (svítí / nesvítí). Dvě lampy: 2 × 2. A šest?"},{"id":"s1","topic":"sifry","level":1,"title":"Posun o jedno","text":"<p>Bobr zašifroval slovo tak, že každé písmeno nahradil písmenem <b>hned za ním</b> v abecedě (A → B, B → C…).</p><p>Zašifrované slovo: <b class=\"big\">LPMP</b></p>","visual":["alphabet"],"question":"Jaké slovo bobr zašifroval?","type":"text","hint":"Při luštění posouvej každé písmeno o jedno místo ZPĚT."},{"id":"s2","topic":"sifry","level":1,"title":"Zašifruj sám","text":"<p>Zašifruj slovo <b class=\"big\">VODA</b>. Každé písmeno posuň o jedno místo <b>dopředu</b> (A → B).</p>","visual":["alphabet"],"question":"Jak bude vypadat zašifrované slovo?","type":"text","hint":"Za V je W. Pokračuj s dalšími písmeny."},{"id":"s3","topic":"sifry","level":2,"title":"Posun o tři","text":"<p>Tentokrát bobr posunul každé písmeno o <b>3 místa dopředu</b> (A → D).</p><p>Zašifrované slovo: <b class=\"big\">EREU</b></p>","visual":["alphabet"],"question":"Jaké slovo bobr zašifroval?","type":"text","hint":"Od každého písmena odpočítej 3 místa zpátky. E, D, C, B…"},{"id":"s4","topic":"sifry","level":2,"title":"Přes konec abecedy","text":"<p>Zašifruj slovo <b class=\"big\">ZUBY</b> posunem o <b>2 místa dopředu</b>. Když dojdeš na konec abecedy, pokračuješ znovu od A (… Y, Z, A, B …).</p>","visual":["alphabet"],"question":"Jak bude vypadat zašifrované slovo?","type":"text","hint":"Z o dvě dopředu: za Z je A, za A je B."},{"id":"s5","topic":"sifry","level":3,"title":"Najdi klíč","text":"<p>Bobr zašifroval slovo <b>BOBR</b> a vyšlo mu <b class=\"big\">GTGW</b>. Všechna písmena posunul o stejný počet míst dopředu.</p>","visual":["alphabet"],"question":"O kolik míst písmena posunul?","type":"number","hint":"Počítej, kolik kroků je z B do G."},{"id":"s6","topic":"sifry","level":3,"title":"Šifra, která roste","text":"<p>Chytřejší bobr posunul <b>1. písmeno o 1</b>, 2. písmeno o 2, 3. o 3 a 4. o 4 místa dopředu.</p><p>Zašifrované slovo: <b class=\"big\">PUHP</b></p>","visual":["alphabet"],"question":"Jaké slovo bobr zašifroval?","type":"text","hint":"Každé písmeno posouvej zpátky o jiný počet: P o 1, U o 2, H o 3, P o 4."},{"id":"s7","topic":"sifry","level":4,"title":"Zrcadlová abeceda","text":"<p>Bobr používá zrcadlovou abecedu: <b>A ↔ Z, B ↔ Y, C ↔ X</b>… První písmeno abecedy se zamění s posledním, druhé s předposledním a tak dál.</p><p>Zašifrované slovo: <b class=\"big\">SIZA</b></p>","visual":["alphabet"],"question":"Jaké slovo bobr zašifroval?","type":"text","hint":"Napiš si abecedu a pod ni stejnou abecedu pozpátku. Pak hledej písmena."},{"id":"h1","topic":"hromady","level":1,"title":"Hromada talířů","text":"<p>Bobr skládá talíře na sebe: nejdřív <b>A</b>, pak <b>B</b>, pak <b>C</b>. Talíř může vzít jen <b>shora</b>.</p>","visual":["stack",["A","B","C"]],"question":"Který talíř vezme jako první?","type":"choice","options":["A","B","C","kterýkoli"],"hint":"Který talíř leží nahoře?"},{"id":"h2","topic":"hromady","level":1,"title":"Fronta k vodě","text":"<p>K napajedlu přišli do fronty bobři <b>A</b>, pak <b>B</b>, pak <b>C</b>. Napít se jde vždy ten, kdo je ve frontě <b>první</b>.</p>","question":"Kdo se napije první?","type":"choice","options":["A","B","C","kdokoli"],"hint":"Jak to chodí ve frontě v obchodě?"},{"id":"h3","topic":"hromady","level":2,"title":"Hromada klád","text":"<p>Bobr skládá klády na hromadu a bere jen shora:</p><ol><li>položí 1, 2, 3</li><li>vezme kládu</li><li>položí 4</li><li>vezme kládu</li><li>vezme kládu</li></ol>","question":"V jakém pořadí klády odnesl?","type":"choice","options":["3 4 2","1 2 4","3 2 4","4 3 2"],"hint":"Kresli si hromadu po každém kroku."},{"id":"h4","topic":"hromady","level":2,"title":"Fronta, nebo hromada?","text":"<p>Do <b>fronty</b> přijdou postupně bobři A, B, C, D. Pak <b>dva bobři</b> odejdou.</p>","question":"Kdo zůstane?","type":"choice","options":["A a B","C a D","A a D","B a C"],"hint":"Ve frontě se odchází zepředu."},{"id":"h5","topic":"hromady","level":3,"title":"Které pořadí nejde?","text":"<p>Ke hrázi připlouvají klády <b>1, 2, 3, 4</b> přesně v tomto pořadí. Bobr připlutou kládu položí na hromadu a kdykoli může odnést kládu z vrchu hromady na hráz.</p>","question":"Které pořadí klád na hrázi bobr vytvořit NEDOKÁŽE?","type":"choice","options":["2 1 3 4","1 4 3 2","4 1 2 3","3 2 1 4"],"hint":"Aby jako první odnesl kládu 4, musí na hromadu položit všechny klády. Která je pak nahoře?"},{"id":"h6","topic":"hromady","level":3,"title":"Zpět v prohlížeči","text":"<p>Bobr na internetu postupně otevřel stránky <b>A</b>, <b>B</b>, <b>C</b>. Pak:</p><ol><li>klikl na <b>Zpět</b></li><li>klikl na <b>Zpět</b></li><li>otevřel novou stránku <b>D</b></li><li>klikl na <b>Zpět</b></li></ol>","question":"Na které stránce teď je?","type":"choice","options":["A","B","C","D"],"hint":"Prohlížeč si pamatuje stránky jako hromadu. Co se stane s B a C, když otevře novou stránku?"},{"id":"h7","topic":"hromady","level":4,"title":"Malá hromada","text":"<p>Klády <b>1, 2, 3, 4</b> připlouvají v tomto pořadí. Bobr je skládá na hromadu, ale hromada unese <b>nejvýš 2 klády</b>. Kdykoli může odnést kládu z vrchu.</p>","question":"Které pořadí na hrázi NEJDE?","type":"choice","options":["2 1 4 3","1 3 2 4","3 2 1 4","2 3 1 4"],"hint":"Spočítej, kolik klád musí ležet na hromadě najednou, aby mohl jako první odnést kládu 3."},{"id":"l1","topic":"logika","level":1,"title":"Korálky","text":"<p>Bobřice navléká korálky pořád podle stejného pravidla.</p>","visual":["beads",["r","b","b","g","r","b","b","g"]],"question":"Jakou barvu bude mít 13. korálek?","type":"choice","options":["červenou","modrou","zelenou","žlutou"],"hint":"Kolik korálků je v jedné opakující se skupině?"},{"id":"l2","topic":"logika","level":1,"title":"Na lavičce","text":"<p>Ali, Bára a Cyril sedí vedle sebe na lavičce.</p><ul><li>Bára nesedí na kraji.</li><li>Cyril sedí vpravo od Báry.</li></ul>","question":"Kdo sedí úplně vlevo?","type":"choice","options":["Ali","Bára","Cyril","nedá se zjistit"],"hint":"Kde sedí Bára, když nesedí na kraji?"},{"id":"l3","topic":"logika","level":2,"title":"Co přijde dál?","text":"<p>Bobr píše čísla podle pravidla: <b class=\"big\">2, 5, 11, 23, ?</b></p>","question":"Jaké číslo přijde dál?","type":"number","hint":"Zkus, co se stane s číslem, když ho vynásobíš dvěma."},{"id":"l4","topic":"logika","level":2,"title":"Kdo snědl mrkev?","text":"<p>Jeden ze tří bobrů snědl mrkev.</p><p><b>Ali:</b> „Byla to Bára.“<br><b>Bára:</b> „Já to nebyla.“<br><b>Cyril:</b> „Já to nebyl.“</p><p><b>Pravdu mluví jen jeden</b> z nich.</p>","question":"Kdo snědl mrkev?","type":"choice","options":["Ali","Bára","Cyril","nedá se zjistit"],"hint":"Zkus postupně: když to byl Ali, kolik bobrů mluví pravdu? A když Bára? A když Cyril?"},{"id":"l5","topic":"logika","level":3,"title":"Kdo mluví pravdu?","text":"<p>Každý bobr buď vždy mluví pravdu, nebo vždy lže.</p><p><b>Ali:</b> „Bára lže.“<br><b>Bára:</b> „Cyril lže.“<br><b>Cyril:</b> „Ali i Bára lžou.“</p>","question":"Kdo mluví pravdu?","type":"choice","options":["jen Ali","jen Bára","jen Cyril","Ali a Cyril"],"hint":"Začni Cyrilem. Co by platilo, kdyby mluvil pravdu?"},{"id":"l6","topic":"logika","level":3,"title":"Tři hráze","text":"<p>Ema, Filip a Gita bydlí ve třech hrázích vedle sebe (vlevo, uprostřed, vpravo). Hráze jsou modrá, zelená a žlutá.</p><ul><li>Ema bydlí úplně vlevo.</li><li>Žlutá hráz je úplně vpravo.</li><li>Gita nebydlí v modré hrázi.</li><li>Filip nebydlí vedle Emy.</li></ul>","question":"Kdo bydlí v zelené hrázi?","type":"choice","options":["Ema","Filip","Gita","nedá se zjistit"],"hint":"Kde bydlí Filip, když nebydlí vedle Emy?"},{"id":"p1","topic":"cesty","level":1,"title":"Kudy k hrázi?","text":"<p>Čísla u cest ukazují, kolik minut cesta trvá.</p>","visual":["graph",{"P":{"A":[50,150],"B":[200,40],"C":[350,150]},"E":[["A","B",2],["B","C",3],["A","C",6]],"start":"A","w":400}],"question":"Kolik minut trvá nejrychlejší cesta z A do C?","type":"number","hint":"Porovnej přímou cestu a cestu přes B."},{"id":"p2","topic":"cesty","level":1,"title":"Zpráva po řetězu","text":"<p>Bobři stojí v řadě a každý se může bavit jen se sousedem. Každou minutu řekne každý bobr, který novinu zná, ji svým sousedům.</p>","visual":["graph",{"P":{"A":[40,60],"B":[150,60],"C":[260,60],"D":[370,60]},"E":[["A","B"],["B","C"],["C","D"]],"start":"A","w":410}],"question":"Bobr A zná novinu. Za kolik minut ji bude znát D?","type":"number","hint":"Minuta 1: B. Minuta 2: …"},{"id":"p3","topic":"cesty","level":2,"title":"Zrádná oklika","text":"<p>Bobr plave z rybníka <b>A</b> do rybníka <b>E</b>. Čísla jsou minuty.</p>","visual":["graph",{"P":{"A":[40,130],"B":[180,40],"C":[180,220],"D":[320,40],"E":[440,130]},"E":[["A","B",4],["A","C",1],["C","B",2],["B","D",1],["C","D",6],["D","E",2],["C","E",9]],"start":"A","w":480}],"question":"Kolik minut trvá nejrychlejší cesta z A do E?","type":"number","hint":"Ke každému rybníku si napiš, za kolik nejméně minut se tam dá doplavat. Do B je to rychleji oklikou."},{"id":"p4","topic":"cesty","level":2,"title":"Kdo má začít?","text":"<p>Bobři si předávají novinu po čarách, každou minutu o jeden skok dál. Novinu má začít šířit jeden bobr tak, aby ji <b>všichni znali co nejdřív</b>.</p>","visual":["graph",{"P":{"A":[40,110],"B":[150,110],"C":[260,110],"D":[370,110],"E":[480,110],"F":[260,220]},"E":[["A","B"],["B","C"],["C","D"],["D","E"],["C","F"]],"w":520}],"question":"Který bobr by měl začít?","type":"choice","options":["bobr B","bobr C","bobr D","bobr F"],"hint":"U každé možnosti spočítej, kolik minut trvá cesta k nejvzdálenějšímu bobrovi."},{"id":"p5","topic":"cesty","level":3,"title":"Propoj rybníky","text":"<p>Bobři chtějí propojit všech pět rybníků kanály tak, aby se dalo doplavat odkudkoli kamkoli (klidně oklikou). Čísla říkají, kolik práce stojí vykopat kanál. Nemusí kopat všechny.</p>","visual":["graph",{"P":{"A":[40,120],"B":[170,40],"C":[170,200],"D":[320,40],"E":[320,200]},"E":[["A","B",2],["A","C",3],["B","C",1],["B","D",4],["C","D",5],["C","E",6],["D","E",2]],"w":380}],"question":"Kolik práce nejméně stačí?","type":"number","hint":"Vybírej kanály od nejlevnějšího. Přeskoč kanál, který spojuje už propojené rybníky."},{"id":"p6","topic":"cesty","level":3,"title":"Kolik je cest?","text":"<p>Bobr jde z levého horního políčka (S) do pravého dolního (H). Smí chodit jen <b>doprava</b> a <b>dolů</b>.</p>","visual":["paths",{"rows":3,"cols":4}],"question":"Kolik různých cest existuje?","type":"number","hint":"Do každého políčka napiš, kolika cestami se do něj dá dojít: součet cest zleva a shora."},{"id":"p7","topic":"cesty","level":4,"title":"Cesta přes bažinu","text":"<p>Bobr chce co nejrychleji ze startu <b>S</b> do cíle <b>T</b>. Čísla jsou minuty.</p>","visual":["graph",{"P":{"S":[40,130],"A":[180,40],"B":[180,220],"C":[320,40],"D":[320,220],"T":[450,130]},"E":[["S","A",3],["S","B",1],["B","A",1],["A","C",4],["A","D",6],["B","D",7],["C","D",1],["C","T",6],["D","T",2]],"start":"S","w":490}],"question":"Kolik minut trvá nejrychlejší cesta?","type":"number","hint":"Ke každému místu zapisuj nejlepší čas. Do A je to rychleji přes B."},{"id":"f1","topic":"hledani","level":1,"title":"Hádej od 1 do 8","text":"<p>Bobřice si myslí číslo od 1 do 8. Bobr se ptá na čísla a ona odpovídá „víc“, „míň“, nebo „uhodl jsi“. Bobr se ptá chytře: vždy na číslo zhruba uprostřed.</p>","question":"Kolik otázek mu vždycky stačí, aby číslo určitě poznal?","type":"number","hint":"Každá odpověď vyřadí asi polovinu čísel. 8 → 4 → …"},{"id":"f2","topic":"hledani","level":2,"title":"Na co se zeptat?","text":"<p>Bobřice si myslí číslo od 1 do 16. Bobr se zeptal „Je to 8?“ a ona řekla „<b>víc</b>“.</p>","question":"Na které číslo se má bobr zeptat teď, aby postupoval nejchytřeji?","type":"choice","options":["9","12","16","4"],"hint":"Která čísla ještě připadají v úvahu? Které je mezi nimi uprostřed?"},{"id":"f3","topic":"hledani","level":2,"title":"Od 1 do 100","text":"<p>Bobřice si myslí číslo od 1 do 100 a odpovídá „víc“, „míň“ nebo „uhodl jsi“.</p>","question":"Kolik otázek bobrovi vždycky stačí, když se ptá co nejchytřeji?","type":"number","hint":"Kolikrát musíš 100 půlit, než zbude jedno číslo?"},{"id":"f4","topic":"hledani","level":3,"title":"Od 1 do 1000","text":"<p>Bobřice si myslí číslo od <b>1 do 1000</b>.</p>","question":"Kolik otázek bobrovi vždycky stačí, když se ptá co nejchytřeji?","type":"number","hint":"1000 → 500 → 250 → … Počítej šipky."},{"id":"f5","topic":"hledani","level":3,"title":"Seřazený seznam","text":"<p>Bobr má seřazený seznam <b>31 jmen</b>. Hledá jedno jméno: otevře vždy prostřední jméno a podle abecedy pozná, jestli hledat v horní, nebo dolní půlce.</p>","question":"Kolikrát nejvýš musí jméno otevřít?","type":"number","hint":"Po otevření prostředního jména zbude v každé půlce 15 jmen. Pak 7, …"},{"id":"f6","topic":"hledani","level":3,"title":"Těžší kláda z devíti","text":"<p>Bobr má 9 stejně vypadajících klád, jedna je o trochu těžší. Má rovnoramenné váhy bez závaží: na každou misku dá libovolně klád a váhy ukážou, která strana je těžší.</p>","question":"Kolik vážení mu jistě stačí?","type":"number","hint":"Nevažuj po jedné ani na půlky. Co když klády rozdělíš na tři hromádky po třech?"},{"id":"f7","topic":"hledani","level":4,"title":"Těžší kláda z 27","text":"<p>Teď má bobr <b>27 klád</b> a jedna je těžší. Váhy jsou stejné jako v minulé úloze.</p>","question":"Kolik vážení mu jistě stačí?","type":"number","hint":"Každé vážení zmenší počet podezřelých klád na třetinu."},{"id":"k1","topic":"pocitac","level":1,"title":"Výstupní zařízení","text":"<p>Vstupní zařízení posílá informace <b>do</b> počítače. Výstupní je <b>z</b> počítače ukazuje nebo přehrává.</p>","question":"Které zařízení je výstupní?","type":"choice","options":["klávesnice","mikrofon","tiskárna","myš"],"hint":"Které zařízení ti něco ukáže nebo vytiskne?"},{"id":"k2","topic":"pocitac","level":1,"title":"Co je v souboru?","text":"<p>Bobr má ve složce čtyři soubory. Konec názvu za tečkou (přípona) prozrazuje, co v souboru je.</p>","question":"Ve kterém souboru je nejspíš hudba?","type":"choice","options":["foto.jpg","pisen.mp3","ukol.docx","hra.exe"],"hint":"Která přípona patří zvuku?"},{"id":"k3","topic":"pocitac","level":2,"title":"Vstupní zařízení","text":"<p><b>klávesnice, monitor, skener, sluchátka, myš, projektor, webkamera</b></p>","question":"Kolik z těchto zařízení je vstupních?","type":"number","hint":"U každého se zeptej: posílám tím něco do počítače?"},{"id":"k4","topic":"pocitac","level":2,"title":"Kopírovat a vložit","text":"<p>V editoru je napsáno <b class=\"big\">LES</b>. Bobr označí <b>LE</b>, dá <b>Kopírovat</b> (Ctrl+C), klikne na konec textu a dá <b>Vložit</b> (Ctrl+V).</p>","question":"Co je teď v editoru?","type":"text","hint":"Kopírovat původní text nechá na místě. Vložit přidá kopii."},{"id":"k5","topic":"pocitac","level":3,"title":"Vyjmout a vložit","text":"<p>V editoru je napsáno <b class=\"big\">KOLO</b>. Bobr:</p><ol><li>označí <b>KO</b> na začátku a dá <b>Vyjmout</b> (Ctrl+X)</li><li>klikne na konec textu a dá <b>Vložit</b> (Ctrl+V)</li><li>dá ještě jednou <b>Vložit</b></li></ol>","question":"Co je teď v editoru?","type":"text","hint":"Vyjmout text smaže a uloží do schránky. Co zbude po kroku 1?"},{"id":"k6","topic":"pocitac","level":3,"title":"Zpět a znovu","text":"<p>V prázdném editoru bobr napíše <b>A</b>, <b>B</b>, <b>C</b> (každé písmeno je jeden krok). Pak:</p><ol><li><b>Zpět</b> (Ctrl+Z)</li><li><b>Zpět</b></li><li><b>Znovu</b> (Ctrl+Y)</li></ol>","question":"Co je v editoru?","type":"text","hint":"Zpět vrátí     const w = 64, gap = 14, W = nums.length * (w + gap) - gap + 20;
    let s = `<svg viewBox="0 0 ${W} 110" width="${W}" role="img" aria-label="Karty: ${nums.join(", ")}">`;
    nums.forEach((n, i) => { const x = 10 + i * (w + gap);
      s += `<rect x="${x}" y="10" width="${w}" height="88" rx="10" fill="var(--surface)" stroke="var(--wood)" stroke-width="3"/><text x="${x + w / 2}" y="68" text-anchor="middle" font-size="36" font-weight="800" fill="var(--ink)" font-family="var(--f-display)">${n}</text>`; });
    return s + `</svg>`;
  },
  lamps(o) {
    const rows = o.rows, n = rows[0].filter(v => typeof v === "number").length, top = o.values ? 34 : 10, H = top + rows.length * 62;
    const W = 40 + n * 56 + 90;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Lampy">`;
    if (o.values) o.values.forEach((v, i) => s += `<text x="${40 + i * 56}" y="22" text-anchor="middle" font-size="17" font-weight="800" fill="var(--muted)">${v}</text>`);
    rows.forEach((row, r) => { const y = top + 26 + r * 62;
      row.forEach((v, i) => {
        if (typeof v === "number") s += `<circle cx="${40 + i * 56}" cy="${y}" r="21" fill="${v ? "var(--sun)" : "var(--surface)"}" stroke="var(--ink)" stroke-width="2"/>`;
        else s += `<text x="${40 + n * 56 - 10}" y="${y + 8}" font-size="22" font-weight="800" fill="var(--ink)">${v}</text>`; }); });
    return s + `</svg>`;
  },
  alphabet() {
    const L = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    let s = `<svg viewBox="0 0 540 96" width="540" role="img" aria-label="Abeceda od A do Z s pořadím">`;
    L.forEach((ch, i) => { const row = i < 13 ? 0 : 1, col = i % 13, x = 22 + col * 40, y = 26 + row * 46;
      s += `<text x="${x}" y="${y}" font-size="19" font-weight="800" fill="var(--ink)" text-anchor="middle">${ch}</text><text x="${x}" y="${y + 17}" font-size="11" fill="var(--muted)" text-anchor="middle">${i + 1}</text>`; });
    return s + `</svg>`;
  },
  grid(letters) {
    const n = 5, sz = 56, o = 20;
    let s = `<svg viewBox="0 0 320 320" width="300" role="img" aria-label="Mřížka 5 na 5, start S vlevo dole">`;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) s += `<rect x="${o + c * sz}" y="${o + r * sz}" width="${sz}" height="${sz}" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>`;
    const put = (c, r, t, fill, col) => `<circle cx="${o + c * sz + sz / 2}" cy="${o + r * sz + sz / 2}" r="20" fill="${fill}"/><text x="${o + c * sz + sz / 2}" y="${o + r * sz + sz / 2 + 8}" text-anchor="middle" font-size="22" font-weight="800" fill="${col}">${t}</text>`;
    s += put(0, 4, "S", "var(--wood)", "var(--surface)");
    letters.forEach(([t, c, r]) => s += put(c, r, t, "var(--river-soft)", "var(--river)"));
    return s + `</svg>`;
  },
  graph(o) {
    const P = o.P, h = Math.max(...Object.values(P).map(p => p[1])) + 40;
    let s = `<svg viewBox="0 0 ${o.w} ${h}" width="${o.w}" role="img" aria-label="Síť míst ${Object.keys(P).join(", ")}">`;
    o.E.forEach(([a, b, wt]) => { const [x1, y1] = P[a], [x2, y2] = P[b], mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--river)" stroke-width="6" stroke-linecap="round"/>`;
      if (wt != null) s += `<circle cx="${mx}" cy="${my}" r="14" fill="var(--surface)" stroke="var(--river)" stroke-width="2"/><text x="${mx}" y="${my + 6}" text-anchor="middle" font-size="16" font-weight="800" fill="var(--ink)">${wt}</text>`; });
    Object.entries(P).forEach(([k, [x, y]]) => { const hot = k === o.start;
      s += `<circle cx="${x}" cy="${y}" r="24" fill="${hot ? "var(--wood)" : "var(--river-soft)"}" stroke="var(--river)" stroke-width="3"/><text x="${x}" y="${y + 8}" text-anchor="middle" font-size="22" font-weight="800" fill="${hot ? "var(--surface)" : "var(--river)"}">${k}</text>`; });
    return s + `</svg>`;
  },
  paths(o) {
    const sz = 64, pad = 16, W = o.cols * sz + pad * 2, H = o.rows * sz + pad * 2;
    let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Mřížka ${o.rows} na ${o.cols} políček, S vlevo nahoře, H vpravo dole">`;
    for (let r = 0; r < o.rows; r++) for (let c = 0; c < o.cols; c++) s += `<rect x="${pad + c * sz}" y="${pad + r * sz}" width="${sz}" height="${sz}" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>`;
    const lab = (c, r, t, f) => `<circle cx="${pad + c * sz + sz / 2}" cy="${pad + r * sz + sz / 2}" r="20" fill="${f}"/><text x="${pad + c * sz + sz / 2}" y="${pad + r * sz + sz / 2 + 8}" text-anchor="middle" font-size="22" font-weight="800" fill="var(--surface)">${t}</text>`;
    return s + lab(0, 0, "S", "var(--wood)") + lab(o.cols - 1, o.rows - 1, "H", "var(--leaf)") + `</svg>`;
  },
  beads(seq) {
    let s = `<svg viewBox="0 0 520 90" width="520" role="img" aria-label="Korálky v řadě, pak otazník">`;
    s += `<path d="M10 45 H510" stroke="var(--muted)" stroke-width="3"/>`;
    seq.forEach((c, i) => { const x = 34 + i * 52; s += `<circle cx="${x}" cy="45" r="21" fill="${COL[c]}" stroke="var(--ink)" stroke-width="2"/><text x="${x}" y="84" text-anchor="middle" font-size="13" fill="var(--muted)" font-weight="700">${i + 1}</text>`; });
    const x = 34 + seq.length * 52;
    return s + `<circle cx="${x}" cy="45" r="21" fill="var(--surface)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/><text x="${x}" y="53" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">?</text></svg>`;
  },
  stack(items) {
    let s = `<svg viewBox="0 0 220 ${items.length * 34 + 20}" width="220" role="img" aria-label="Hromada: dole ${items[0]}, nahoře ${items[items.length - 1]}">`;
    items.forEach((t, i) => { const y = (items.length - 1 - i) * 34 + 10;
      s += `<rect x="40" y="${y}" width="140" height="28" rx="14" fill="var(--wood)"/><text x="110" y="${y + 20}" text-anchor="middle" font-size="17" font-weight="800" fill="var(--surface)">${t}</text>`; });
    return s + `</svg>`;
  }
};
function drawVisual(v) { if (!v || !VIS[v[0]]) return ""; return `<div class="visual">${VIS[v[0]](v[1])}</div>`; }

/* =====================================================================
   ODZNAKY (celkové, ne za téma)
   ===================================================================== */
const BADGES = [
  { id: "first", name: "První kláda", desc: "Vyřeš první úlohu", test: s => s.solved >= 1 },
  { id: "ten", name: "Desítka", desc: "Vyřeš 10 úloh", test: s => s.solved >= 10 },
  { id: "thirty", name: "Pilný bobr", desc: "Vyřeš 30 úloh", test: s => s.solved >= 30 },
  { id: "sharp", name: "Ostrý zub", desc: "5 úloh hned napoprvé", test: s => s.perfect >= 5 },
  { id: "explorer", name: "Průzkumník", desc: "Aspoň 1 úloha v každém tématu", test: s => s.topicsTouched === TOPICS.length },
  { id: "topic", name: "Mistr tématu", desc: "Vyřeš celé jedno téma", test: s => s.topicsDone >= 1 },
  { id: "brave", name: "Odvážlivec", desc: "Vyřeš 3 mistrovské úlohy", test: s => s.masters >= 3 },
  { id: "stubborn", name: "Nevzdávám to", desc: "Vyřeš úlohu po 3 chybách bez nápovědy řešení", test: s => s.stubborn >= 1 },
  { id: "all", name: "Bobří profesor", desc: "Vyřeš úplně všechno", test: s => s.solved === s.total }
];
const BADGE_ICON = `<svg class="b-ico" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 L21 12 L32 13 L23.5 20 L26 31 L17 25 L8 31 L10.5 20 L2 13 L13 12 Z" fill="currentColor"/></svg>`;

/* =====================================================================
   STAV A UKLÁDÁNÍ
   ===================================================================== */
const KEY = "bobri-trenink-v1";
function loadStore() {
  const s = { name: "", profiles: {}, starts: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(s, JSON.parse(raw)); } catch (e) {}
  if (!s.starts) s.starts = {};
  return s;
}
let store = loadStore();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function nameKey() { return (store.name || "host").trim().toLowerCase(); }
function prof() { const k = nameKey(); if (!store.profiles[k]) store.profiles[k] = { tasks: {} }; return store.profiles[k]; }
function tstate(id) { const p = prof(); if (!p.tasks[id]) p.tasks[id] = { status: "new", attempts: 0, stars: 0, wrong: [] }; return p.tasks[id]; }
function touchProf() { const p = prof(); p.updated = Date.now(); p.name = (store.name || "").trim(); }

const LESSON_MS = 3 * 60 * 60 * 1000;
function getStart() { const v = store.starts[nameKey()]; return v && Date.now() - v < LESSON_MS ? new Date(v) : null; }
function ensureStart() { if (!getStart()) { store.starts[nameKey()] = Date.now(); save(); } }

const view = { screen: "home", topic: null, taskId: null, choice: null, result: null, trap: null, timing: null, newBadges: [] };

/* Měření času nad úlohou: jen když je úloha otevřená, nevyřešená a okno vidět; úsek nejvýš 10 minut */
function flushTime() {
  const tm = view.timing; if (!tm) return;
  const st = tstate(tm.id);
  st.time = (st.time || 0) + Math.round(Math.min(Date.now() - tm.t0, 600000) / 1000);
  view.timing = null; save();
}
function startTiming() {
  if (view.screen !== "task" || document.hidden) return;
  const st = tstate(view.taskId);
  if (st.status === "done" || st.status === "revealed") return;
  view.timing = { id: view.taskId, t0: Date.now() };
}
document.addEventListener("visibilitychange", () => { if (document.hidden) flushTime(); else startTiming(); });
window.addEventListener("pagehide", flushTime);
window.addEventListener("storage", e => { if (e.key === KEY) { flushTime(); store = loadStore(); if (view.screen !== "task") render(); else startTiming(); } });

function tasksOf(topic) { return TASKS.filter(t => t.topic === topic); }
function stats() {
  const p = prof(), s = { total: TASKS.length, solved: 0, stars: 0, maxStars: TASKS.length * 3, perfect: 0, masters: 0, stubborn: 0, seen: 0, topicsTouched: 0, topicsDone: 0, byTopic: {} };
  TASKS.forEach(t => { const st = p.tasks[t.id]; const bt = s.byTopic[t.topic] || (s.byTopic[t.topic] = { solved: 0, total: 0, stars: 0, touched: false });
    bt.total++;
    if (!st) return;
    if (st.attempts > 0 || st.status !== "new") bt.touched = true;
    if (st.seen) s.seen++;
    if (st.status === "done") { s.solved++; bt.solved++; s.stars += st.stars; bt.stars += st.stars;
      if (st.stars === 3) s.perfect++; if (t.level === 4) s.masters++; if (!st.seen && st.attempts >= 4) s.stubborn++; } });
  TOPICS.forEach(T => { const bt = s.byTopic[T.id]; if (bt.solved > 0) s.topicsTouched++; if (bt.solved === bt.total) s.topicsDone++; });
  return s;
}
function earnedBadges() { const s = stats(); return BADGES.filter(b => b.test(s)).map(b => b.id); }

/* =====================================================================
   VYKRESLENÍ
   ===================================================================== */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const starRow = (n, max = 3) => Array.from({ length: max }, (_, i) => i < n ? "<b>★</b>" : "★").join("");
const diffChip = l => `<span class="diff d${l}">${LEVELS[l]}</span>`;
const ladder = l => `<span class="ladder" aria-hidden="true">${[1, 2, 3, 4].map(i => `<i class="${i <= l ? "on" : ""}" style="height:${4 + i * 3}px"></i>`).join("")}</span>`;

function render() {
  flushTime();
  const inGame = view.screen !== "home";
  document.getElementById("barRight").innerHTML = inGame
    ? `<span class="pill"><span class="star">★</span> ${stats().stars}</span><span class="pill">${esc(store.name || "host")}</span><button class="btn finish" id="finishBtn">Odešli výsledky Pétě</button>` : "";
  const fin = document.getElementById("finishBtn"); if (fin) fin.onclick = () => openModal("confirm");
  if (view.screen === "home") renderHome();
  else if (view.screen === "topic") renderTopic();
  else renderTask();
  startTiming();
  window.scrollTo({ top: 0 });
}

function renderHome() {
  const s = stats();
  app.innerHTML = `
    <section class="hero">
      <h1>Bobří <span>trénink</span></h1>
      <p>Vyber si téma a trénuj. Úlohy jdou od lehkých po mistrovské a můžeš začít kteroukoli. Po každé úloze si přečti, jak se řeší krok za krokem.</p>
      <div class="name-row">
        <label for="nameInput">Jak se jmenuješ?</label>
        <input id="nameInput" maxlength="40" placeholder="jméno a příjmení (ne přezdívku)" value="${esc(store.name)}" autocomplete="off">
      </div>
      ${store.name.trim() ? `<div class="stats-row"><span class="pill">Vyřešeno ${s.solved} z ${s.total}</span><span class="pill"><span class="star">★</span> ${s.stars} z ${s.maxStars}</span></div>` : ""}
    </section>
    <div class="topics">
      ${TOPICS.map(T => { const bt = s.byTopic[T.id]; return `
        <button class="topic ${bt.solved === bt.total ? "complete" : ""}" data-topic="${T.id}">
          <span class="t-ico" aria-hidden="true">${T.ico}</span>
          <h2>${T.name}</h2>
          <span class="t-desc">${T.desc}</span>
          <span class="meter"><i style="width:${Math.round(bt.solved / bt.total * 100)}%"></i></span>
          <span class="meta"><span>${bt.solved} z ${bt.total} úloh</span><span><span class="star">★</span> ${bt.stars}</span></span>
        </button>`; }).join("")}
    </div>
    ${badgesHtml(s)}`;
  const inp = document.getElementById("nameInput");
  inp.addEventListener("input", () => { store.name = inp.value; save(); });
  inp.addEventListener("change", () => render());
  app.querySelectorAll(".topic").forEach(b => b.addEventListener("click", () => {
    if (!store.name.trim()) { inp.focus(); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); inp.placeholder = "nejdřív napiš své jméno a příjmení"; return; }
    view.topic = b.dataset.topic; view.screen = "topic"; ensureStart(); render();
  }));
}
function badgesHtml(s) {
  const got = BADGES.filter(b => b.test(s));
  return `<h2 class="section-title">Odznaky (${got.length} z ${BADGES.length})</h2><div class="badges">${BADGES.map(b => { const has = b.test(s);
    return `<div class="badge ${has ? "got" : ""}" style="color:${has ? "var(--sun)" : "var(--line)"}">${BADGE_ICON}<strong style="color:var(--ink)">${b.name}</strong><span>${b.desc}</span></div>`; }).join("")}</div>`;
}

function renderTopic() {
  const T = TOPICS.find(x => x.id === view.topic), p = prof(), bt = stats().byTopic[T.id];
  app.innerHTML = `
    <button class="back" id="toHome">← Všechna témata</button>
    <div class="map-head"><h1>${T.name}</h1><p>${T.desc} Úlohy jsou seřazené od nejlehčí. Můžeš začít kteroukoli.</p></div>
    <div class="summary"><span class="pill">Vyřešeno ${bt.solved} z ${bt.total}</span><span class="pill"><span class="star">★</span> ${bt.stars} z ${bt.total * 3}</span></div>
    <div class="tasklist">${tasksOf(T.id).map((t, i) => { const st = p.tasks[t.id] || { status: "new", stars: 0 };
      const state = st.status === "done" ? (st.seen ? "vyřešeno po zobrazení řešení" : "vyřešeno") : st.status === "revealed" ? "zobrazené řešení" : st.attempts ? "rozpracováno" : "";
      return `<button class="trow ${st.status}" data-id="${t.id}">
        <span class="log">${i + 1}</span>
        <span class="tr-main"><span class="tr-title">${esc(t.title)}</span><span class="tr-sub">${ladder(t.level)}${diffChip(t.level)}${state ? `<span>${state}</span>` : ""}</span></span>
        <span class="stars">${starRow(st.stars)}</span></button>`; }).join("")}</div>`;
  document.getElementById("toHome").onclick = () => { view.screen = "home"; render(); };
  app.querySelectorAll(".trow").forEach(b => b.addEventListener("click", () => openTask(b.dataset.id)));
}

function openTask(id) { view.taskId = id; view.screen = "task"; view.choice = null; view.result = null; view.trap = null; view.newBadges = []; render(); }

function explainHtml(t) {
  const S = t.sol;
  return `<div class="explain"><h3>Jak na to krok za krokem</h3><ol>${S.steps.map(x => `<li>${x}</li>`).join("")}</ol>
    ${S.mistake ? `<p class="note"><b>Pozor:</b> ${S.mistake}</p>` : ""}
    ${S.why ? `<p class="why">${S.why}</p>` : ""}</div>`;
}

function renderTask() {
  const t = TASKS.find(x => x.id === view.taskId), st = tstate(t.id), S = t.sol;
  const T = TOPICS.find(x => x.id === t.topic);
  const finished = st.status === "done" || st.status === "revealed";
  let answerHtml;
  if (t.type === "choice") {
    answerHtml = `<div class="options" role="radiogroup">${t.options.map((o, i) => { const k = "ABCD"[i];
      return `<button class="opt ${view.choice === k ? "sel" : ""}" data-k="${k}" role="radio" aria-checked="${view.choice === k}" ${finished ? "disabled" : ""}><span class="k">${k}</span><span>${esc(o)}</span></button>`; }).join("")}</div>`;
  } else {
    answerHtml = `<input class="answer-input" id="answerInput" ${t.type === "number" ? "inputmode=\"numeric\"" : ""} autocomplete="off" placeholder="${t.type === "number" ? "číslo" : "slovo"}" ${finished ? "disabled" : ""} value="${finished ? esc(answerText(t)) : ""}">`;
  }
  let fb = "";
  if (st.status === "done") {
    fb = `<div class="feedback ok"><h3>Správně! ${view.result === "ok" && !st.seen ? "Paráda." : ""}</h3><div class="big-stars">${starRow(st.stars)}</div>${st.seen ? `<p class="tries">Řešení jsi už viděl(a), proto jen 1 hvězdička.</p>` : ""}</div>${newBadgeHtml()}${explainHtml(t)}`;
  } else if (st.status === "revealed") {
    fb = `<div class="feedback info"><h3>Řešení</h3><p>Správná odpověď: <b>${esc(answerText(t))}</b></p><p class="tries">Projdi si postup a zkus úlohu znovu tlačítkem dole. Dostaneš za ni nejvýš 1 hvězdičku.</p></div>${explainHtml(t)}`;
  } else if (view.result === "no") {
    fb = `<div class="feedback no"><h3>Ještě ne. Zkus to znovu!</h3>${view.trap ? `<p class="trap">${view.trap}</p>` : ""}${st.attempts >= 2 ? `<p><b>Nápověda:</b> ${t.hint}</p>` : ""}</div>`;
  }
  const next = nextTask(t.id);
  app.innerHTML = `
    <button class="back" id="toTopic">← ${T.name}</button>
    <article class="task" style="margin-top:10px">
      <div class="chips"><span class="chip">${T.name}</span>${diffChip(t.level)}</div>
      <h1>${esc(t.title)}</h1>
      <div class="text">${t.text}</div>
      ${drawVisual(t.visual)}
      <div class="question">${t.question}</div>
      ${answerHtml}
      ${fb}
      <div class="actions">
        ${finished ? "" : `<button class="btn" id="checkBtn">Zkontrolovat</button>`}
        ${!finished && st.attempts >= 3 && !st.seen ? `<button class="btn ghost" id="revealBtn">Ukaž mi řešení</button>` : ""}
        ${finished && next ? `<button class="btn green" id="nextBtn">Další úloha →</button>` : ""}
        ${finished ? `<button class="btn ghost" id="topicBtn">Zpět na téma</button>` : ""}
        ${st.status === "revealed" ? `<button class="btn ghost" id="retryBtn">Zkusit znovu</button>` : ""}
        ${!finished && st.attempts > 0 ? `<span class="tries">Pokus ${st.attempts + 1}</span>` : ""}
      </div>
    </article>`;
  document.getElementById("toTopic").onclick = toTopic;
  app.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { view.choice = b.dataset.k;
    app.querySelectorAll(".opt").forEach(o => { const on = o.dataset.k === view.choice; o.classList.toggle("sel", on); o.setAttribute("aria-checked", on); }); }));
  const inp = document.getElementById("answerInput");
  if (inp && !finished) { inp.focus({ preventScroll: true }); inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); }); }
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("checkBtn", check);
  on("revealBtn", () => { flushTime(); st.status = "revealed"; st.stars = 0; st.seen = true; touchProf(); save(); view.result = null; render(); });
  on("nextBtn", () => openTask(next.id));
  on("topicBtn", toTopic);
  /* Zkusit znovu: pokusy i záznam o zobrazeném řešení zůstávají */
  on("retryBtn", () => { st.status = "new"; save(); view.result = null; view.trap = null; view.choice = null; render(); });
}
function newBadgeHtml() {
  if (!view.newBadges.length) return "";
  return view.newBadges.map(id => { const b = BADGES.find(x => x.id === id); return `<div class="newbadge">${BADGE_ICON}<span>Nový odznak: <strong>${b.name}</strong></span></div>`; }).join("");
}

function toTopic() { view.screen = "topic"; render(); }
function answerText(t) {
  const a = t.sol.a;
  if (t.type === "choice") return a + ") " + t.options["ABCD".indexOf(a)];
  return Array.isArray(a) ? a[0] : String(a);
}
function norm(s) { return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "").toUpperCase(); }
function normVal(t, val) { return t.type === "number" ? String(Number(String(val).replace(",", ".").trim())) : t.type === "choice" ? val : norm(val); }
function isCorrect(t, val) {
  const a = t.sol.a;
  if (t.type === "choice") return val === a;
  if (t.type === "number") return Number(String(val).replace(",", ".").trim()) === Number(a);
  return a.map(norm).includes(norm(val));
}
function nextTask(id) { const list = tasksOf(TASKS.find(t => t.id === id).topic); const i = list.findIndex(t => t.id === id); return list[i + 1] || null; }
function check() {
  const t = TASKS.find(x => x.id === view.taskId), st = tstate(t.id);
  const val = t.type === "choice" ? view.choice : ((document.getElementById("answerInput") || {}).value || "");
  if (!val || !String(val).trim()) {
    const box = document.querySelector(".options, .answer-input");
    if (box) { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
    return;
  }
  flushTime();
  const before = earnedBadges();
  st.attempts++; touchProf();
  if (isCorrect(t, val)) {
    st.status = "done"; st.stars = st.seen ? 1 : st.attempts === 1 ? 3 : st.attempts === 2 ? 2 : 1;
    view.result = "ok"; view.trap = null; save();
    view.newBadges = earnedBadges().filter(id => !before.includes(id));
    render(); confetti();
  } else {
    if (st.wrong.length < 12) st.wrong.push(String(val).trim().slice(0, 20));
    const traps = t.sol.traps || {};
    view.trap = traps[normVal(t, val)] || null;
    view.result = "no"; save(); render();
    const card = document.querySelector(".task"); if (card) card.classList.add("shake");
  }
}

/* konfety */
function confetti() {
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"); if (!ctx) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#E9A72B", "#2C88B0", "#2F8A50", "#D9533B", "#94592F"];
  const parts = Array.from({ length: 90 }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: -Math.random() * 12 - 3, s: Math.random() * 7 + 4, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.r += .1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

const RESULTS_URL = "https://script.google.com/macros/s/AKfycbxgQvs3pQVoYELzUYb8k1kqtck7GdOEx_Wc68OK1KoaLE-Ag1KoxoYOdoltDZEeQgb1Bg/exec";

function fmtDate(d) { return d.toLocaleString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
function fmtSec(s) { s = Math.round(s || 0); return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${s % 60} s`; }
function tm(st) { return st.time == null ? "" : `, ${fmtSec(st.time)}`; }
function wrongList(st) { return st.wrong && st.wrong.length ? `, špatně: ${st.wrong.join(" | ")}${st.attempts - (st.status === "done" ? 1 : 0) > st.wrong.length ? " …" : ""}` : ""; }
function topicDetail(topic) {
  const p = prof();
  return tasksOf(topic).map(t => { const st = p.tasks[t.id];
    let v;
    if (!st || (st.status === "new" && !st.attempts)) return null;
    if (st.status === "new") v = `nevyřešeno (${st.attempts}× špatně${tm(st)}${st.seen ? ", viděl(a) řešení" : ""}${wrongList(st)})`;
    else if (st.status === "revealed") v = `zobrazil(a) řešení (${st.attempts}× špatně${tm(st)}${wrongList(st)})`;
    else v = `${"★".repeat(st.stars)}${st.seen ? " po zobrazení řešení" : ""} (${st.attempts}. pokus${tm(st)}${wrongList(st)})`;
    return `${t.title} [${LEVELS[t.level].toLowerCase()}]: ${v}`; }).filter(Boolean).join("; ");
}
const FAST_SEC = 12;
function warnings() {
  const fast = [], many = [], p = prof();
  TASKS.forEach(t => { const st = p.tasks[t.id]; if (!st) return;
    if (st.status === "done" && st.attempts === 1 && !st.seen && st.time != null && st.time < FAST_SEC) fast.push(`${t.title} (${fmtSec(st.time)})`);
    if (st.attempts >= 5) many.push(`${t.title} (${st.attempts}×)`); });
  return { fast, many };
}
function otherNames() {
  const me = nameKey(), seen = new Set();
  Object.entries(store.profiles).forEach(([k, p]) => { if (k !== me && p.updated && Date.now() - p.updated < LESSON_MS) seen.add(p.name || k); });
  return [...seen];
}
function buildResults() {
  const now = new Date(), start = getStart(), s = stats(), W = warnings();
  const minutes = start ? Math.max(1, Math.round((now - start) / 60000)) : "";
  const rows = [
    ["Odesláno", fmtDate(now)],
    ["Jméno", (store.name || "").trim()],
    ["Začátek práce", start ? fmtDate(start) : ""],
    ["Doba práce (min)", minutes],
    ["Vyřešeno celkem", `${s.solved} z ${s.total}`],
    ["Hvězdičky", s.stars],
    ["Zobrazená řešení", s.seen],
    ["Odznaky", BADGES.filter(b => b.test(s)).map(b => b.name).join(", ")],
    ["Vyřešeno napoprvé za méně než " + FAST_SEC + " s", W.fast.join(", ")],
    ["Hodně pokusů (5 a víc)", W.many.join(", ")],
    ["Jiná jména na tomto počítači", otherNames().join(", ")]
  ];
  TOPICS.forEach(T => { const bt = s.byTopic[T.id]; rows.push([T.name + ": vyřešeno", bt.touched ? `${bt.solved} z ${bt.total}` : ""]); });
  TOPICS.forEach(T => rows.push(["Detail " + T.name, topicDetail(T.id)]));
  return { headers: rows.map(r => r[0]), values: rows.map(r => r[1]), summary: { name: (store.name || "").trim(), solved: s.solved, stars: s.stars, minutes } };
}

const modal = document.getElementById("modal");
function openModal(state, info) {
  const S = buildResults().summary;
  const box = `<div class="m-sum"><span><b>${esc(S.name)}</b></span><span>Vyřešené úlohy: <b>${S.solved}</b> · <span class="star">★</span> ${S.stars}${S.minutes ? ` · ${S.minutes} min` : ""}</span></div>`;
  let html = "";
  if (state === "confirm") html = `<h2>Poslat výsledky Pétě?</h2><p>Odešle se, co jsi dnes vyřešil(a). Pak se trénink pro dnešek uzavře.</p>${box}
      <div class="actions"><button class="btn green" id="mYes">Ano, odeslat</button><button class="btn ghost" id="mNo">Ještě ne, chci trénovat</button></div>`;
  else if (state === "sending") html = `<h2>Odesílám…</h2><p>Chvilku vydrž, bobři nesou výsledky.</p>`;
  else if (state === "sent") html = `<h2>Hotovo, odesláno! 🎉</h2><p>Péťa tvoje výsledky dostala. Skvělá práce!</p>${box}<div class="actions"><button class="btn" id="mDone">Zavřít</button></div>`;
  else if (state === "error") html = `<h2>Odeslání se nepovedlo</h2><p>${info || "Zkontroluj připojení k internetu a zkus to znovu."} Tvůj postup zůstal uložený.</p>${box}<div class="actions"><button class="btn" id="mYes">Zkusit znovu</button><button class="btn ghost" id="mNo">Zpět k tréninku</button></div>`;
  modal.querySelector(".m-card").innerHTML = html;
  modal.hidden = false;
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("mNo", closeModal);
  on("mYes", sendResults);
  on("mDone", () => { closeModal(); delete store.starts[nameKey()]; store.name = ""; save(); view.screen = "home"; render(); });
  const first = modal.querySelector("button"); if (first) first.focus();
}
function closeModal() { modal.hidden = true; }
async function sendResults() {
  flushTime();
  if (!RESULTS_URL) { openModal("error", "Odesílání výsledků zatím není nastavené. Řekni to Pétě."); return; }
  const r = buildResults();
  openModal("sending");
  try {
    const res = await fetch(RESULTS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ headers: r.headers, values: r.values }) });
    const txt = (await res.text()).trim();
    if (txt === "ok") openModal("sent");
    else openModal("error", "Tabulka výsledky nepřijala (" + esc(txt.slice(0, 160) || "prázdná odpověď") + ").");
  } catch (e) {
    openModal("error", "Nepodařilo se spojit s tabulkou. Zkontroluj internet a zkus to znovu.");
  }
}
modal.addEventListener("click", e => { if (e.target === modal && !modal.querySelector("#mDone")) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden && modal.querySelector("#mNo")) closeModal(); });

document.getElementById("homeBtn").onclick = () => { view.screen = "home"; render(); };
render();
</script>
