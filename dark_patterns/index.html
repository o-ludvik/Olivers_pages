<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stanoviště A (verze 2)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Rubik:ital,wght@0,400;0,500;0,700;0,800;1,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0}

/* Layout: workshop HUD bar on top, a phone-sized fictional music app below; single deliberate look (app is always light, stage is dark slate). */
:root{
  --stage:#1d2230; --stage-ink:#e9ecf4; --stage-mute:#9aa3b8;
  --app:#ffffff; --ink:#15161c; --mute:#6c7080; --faint:#b9bcc6; --line:#ececf1; --soft:#f5f5f8;
  --brand:#e3346f; --brand-ink:#ffffff; --gold:#f4b73f; --ok:#1f9d6a; --bad:#d23c3c;
  --f-app:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--stage-ink);font-family:var(--f-app);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[data-go]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.hud{width:100%;max-width:400px;display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--stage-mute)}
.hud b{color:var(--stage-ink);font-weight:700}
.hud .task{flex:1;min-width:0}
.hud .task span{display:block;color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hud .stats{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .reset{background:none;border:1px solid #3a4154;color:var(--stage-mute);border-radius:6px;padding:4px 7px;font-family:var(--f-mono);font-size:11px}

.phone{width:100%;max-width:400px;flex:1;min-height:0;max-height:820px;background:var(--app);color:var(--ink);border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.45);display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:6px}
.logo i{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 200deg,var(--brand),#ff8a5b,var(--brand));display:inline-block}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6b7cff,#b56bff);color:#fff;border:0;font-weight:700;font-size:14px}
.pad{padding:6px 18px 24px}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 14px;text-wrap:balance}
h2{font-size:17px;margin:18px 0 10px}
p{line-height:1.5;margin:0 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:0;background:var(--soft);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:8px;overflow:hidden;font-size:13px;font-weight:700;min-height:52px;border:0;text-align:left;color:var(--ink);padding:0}
.tile .cv{width:52px;height:52px;flex:none}
.covers{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.album{flex:none;width:130px;font-size:12px;color:var(--mute);border:0;background:none;text-align:left;padding:0}
.album .cv{width:130px;height:130px;border-radius:8px;margin-bottom:6px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:800;font-size:15px;line-height:1.1}
.album b{display:block;color:var(--ink);font-size:13px}
.c1{background:linear-gradient(135deg,#ff7a59,#e3346f)}.c2{background:linear-gradient(135deg,#2b5876,#4e4376)}.c3{background:linear-gradient(135deg,#11998e,#38ef7d)}
.c4{background:linear-gradient(135deg,#f7971e,#ffd200)}.c5{background:linear-gradient(135deg,#8e2de2,#4a00e0)}.c6{background:linear-gradient(135deg,#373b44,#4286f4)}

/* disguised ad: looks like a native settings row */
.native{display:flex;align-items:center;gap:12px;width:100%;background:var(--soft);border:0;border-radius:12px;padding:14px;text-align:left;color:var(--ink);margin:16px 0 4px}
.native .ic{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800}
.native b{display:block;font-size:14px}
.native small{color:var(--mute);font-size:12px}
.native .chev{margin-left:auto;color:var(--mute);font-size:20px}
.spon{font-size:9px;color:#d3d5dc;text-align:right;margin:0 0 6px}

.nav{display:flex;border-top:1px solid var(--line);background:#fff}
.nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--ink);font-weight:700}
.nav .ico{width:20px;height:20px;border-radius:5px;border:2px solid currentColor}
.nav .ico.s{border-radius:50%}
.player{display:flex;align-items:center;gap:10px;margin:0 8px 6px;background:#3a2734;color:#fff;border-radius:10px;padding:8px;font-size:12px}
.player .cv{width:36px;height:36px;border-radius:6px}
.player b{display:block;font-size:13px}

.back{border:0;background:none;font-size:15px;font-weight:700;padding:16px 18px 6px;color:var(--ink);display:flex;align-items:center;gap:6px}
.list{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:15px 2px;font-size:15px;text-align:left;color:var(--ink)}
.row small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.row .chev{margin-left:auto;color:var(--faint);font-size:18px}
.profile-head{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.profile-head .avatar{width:64px;height:64px;font-size:24px}
.stat{color:var(--mute);font-size:13px}

.plan{border-radius:16px;padding:18px;color:#fff;background:linear-gradient(140deg,#e3346f,#7a2bd8);margin-bottom:16px}
.plan small{opacity:.85;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.plan h3{margin:4px 0 2px;font-size:22px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:15px;font-weight:800;font-size:15px;background:var(--brand);color:var(--brand-ink);text-align:center}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:none;color:var(--mute);font-weight:500;font-size:13px;padding:10px}
.btn.faint{background:#fafafb;color:#c9cbd2;border:1px solid #f0f0f3;font-weight:500}
.btn + .btn{margin-top:8px}
.perks{list-style:none;padding:0;margin:0 0 18px}
.perks li{padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px}
.perks li::before{content:"✓";color:var(--brand);font-weight:800}
.tiny{font-size:11px;color:#c3c5cd;text-align:center;margin-top:26px}
.tiny button{border:0;background:none;color:#c3c5cd;font-size:11px;text-decoration:none;padding:4px}
.fine{font-size:11px;color:var(--faint);line-height:1.45}

.hero-ill{height:150px;border-radius:16px;margin:4px 0 16px;display:grid;place-items:center;font-size:54px;color:#fff;font-weight:800}
input[type=tel],input[type=email]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px;font:inherit;font-size:16px;margin:4px 0 12px;color:var(--ink);background:#fff}
label.lb{font-size:13px;font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--mute);margin:4px 0 16px}
.check input{margin-top:2px;accent-color:var(--brand)}
.timer{font-family:var(--f-mono);font-weight:700;background:#fff1f5;color:var(--brand);border-radius:8px;padding:8px 10px;text-align:center;margin-bottom:14px;font-variant-numeric:tabular-nums}
.loss{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loss li{background:var(--soft);border-radius:12px;padding:12px;font-size:12px;color:var(--mute)}
.loss li b{display:block;font-size:20px;color:var(--ink)}
.q{font-size:19px;font-weight:800;line-height:1.35;margin:8px 0 22px;text-wrap:balance}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .btn + .btn{margin-top:0}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(15,16,22,.55);display:flex;align-items:flex-end;z-index:5}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:22px 20px 22px}
.sheet h3{margin:0 0 8px;font-size:20px}
.adfull{position:absolute;inset:0;z-index:6;background:linear-gradient(160deg,#0f3d3e,#0b1f33);color:#fff;display:flex;flex-direction:column;padding:22px}
.adfull .x{align-self:flex-end;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-family:var(--f-mono)}
.adfull .x[disabled]{opacity:.6;cursor:default}
.adfull .big{margin:auto 0;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.adfull .big em{font-style:normal;color:#5ef2c2}
.toast{position:absolute;left:14px;right:14px;bottom:76px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* win */
.win{position:absolute;inset:0;z-index:9;background:var(--stage);color:var(--stage-ink);overflow-y:auto;padding:26px 22px}
.win .tag{font-family:var(--f-mono);color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.win h1{font-size:34px;margin:6px 0 6px;color:#fff}
.win .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.win .nums div{background:#272d3d;border-radius:12px;padding:12px 10px;font-size:11px;color:var(--stage-mute)}
.win .nums b{display:block;font-family:var(--f-mono);font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.win .code{border:2px dashed var(--gold);border-radius:14px;padding:14px;text-align:center;margin:8px 0 18px}
.win .code b{font-family:var(--f-mono);font-size:28px;letter-spacing:.2em;color:var(--gold)}
.win .reveal{width:100%;border:1px solid #3a4154;background:#272d3d;color:#fff;border-radius:12px;padding:13px;font-weight:700}
.win ol{padding-left:20px;margin:14px 0 0}
.win li{margin-bottom:12px;line-height:1.45;font-size:14px;color:var(--stage-mute)}
.win li b{color:#fff}
.win .caught{font-size:13px;color:var(--stage-mute)}
@media (prefers-reduced-motion:no-preference){.screen,.sheet,.win{animation:in .22s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
[hidden]{display:none!important}
/* ---- Station hub ---- */
#v-hub{width:100%;max-width:760px;padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}
#v-tonik{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.h-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.h-title{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.03em;margin:4px 0 6px;color:#fff;text-wrap:balance;line-height:1.05}
.h-lead{color:var(--stage-mute);max-width:60ch;line-height:1.55;margin:0}
.h-reset{background:none;border:1px solid #3a4154;color:var(--stage-mute);border-radius:8px;padding:7px 11px;font-family:var(--f-mono);font-size:12px}
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tcard{background:#272d3d;border:1px solid #333a4d;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--stage-mute);display:flex;justify-content:space-between;gap:8px}
.tcard h3{margin:0;font-size:20px;color:#fff}
.tcard p{margin:0;color:#c3c9d8;font-size:14px;line-height:1.5;flex:1}
.tcard .go{border:0;border-radius:999px;padding:12px;font-weight:800;background:var(--brand);color:#fff}
.tcard.done{border-color:#2f7d5d}
.tcard.done .lab b{color:#5fd3a0}
.tcard.off{opacity:.5;border-style:dashed}
.tcard.off .go{background:#333a4d;color:var(--stage-mute);cursor:not-allowed}
.steps{display:flex;flex-direction:column;gap:14px}
.step{background:#232938;border-radius:16px;padding:20px;border:1px solid #2e3446}
.step.locked{opacity:.55}
.step-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.step-n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:#333a4d;color:#fff;font-size:13px}
.step.ok .step-n{background:#2f7d5d}
.step h2{margin:0;font-size:19px;color:#fff}
.step p,.step li{color:#c3c9d8;line-height:1.55;font-size:15px}
.lockmsg{font-family:var(--f-mono);font-size:12px;color:var(--stage-mute);margin:0}
.read h3{color:#fff;font-size:16px;margin:20px 0 8px}
.read details{margin-top:12px;background:#2a3142;border-radius:12px}
.read summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;color:#fff;font-weight:700;font-size:16px}
.read summary::-webkit-details-marker{display:none}
.read summary::after{content:"▾";color:var(--gold);font-size:18px;transition:transform .2s}
.read details[open] summary::after{transform:rotate(180deg)}
.read details > div{padding:0 16px 16px}
.read details .pats li{background:#323a4e}
.tbl{overflow-x:auto;margin:6px 0 4px}
.tbl table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
.tbl th{text-align:left;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);padding:8px 10px;border-bottom:1px solid #3a4154}
.tbl td{padding:10px;border-bottom:1px solid #2e3446;color:#c3c9d8;vertical-align:top;line-height:1.45}
.tbl td:first-child{color:#fff;font-weight:700;white-space:nowrap}
.pats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:0;list-style:none;margin:0}
.pats li{background:#2a3142;border-radius:12px;padding:12px 14px;font-size:14px;margin:0}
.pats b{color:#fff;display:block}
.pats i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--stage-mute)}
.hbtn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;background:var(--gold);color:#1d2230;margin-top:14px}
.hbtn[disabled]{opacity:.4;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-weight:700;color:#fff;font-size:14px}
.field textarea{width:100%;min-height:120px;resize:vertical;border-radius:12px;border:1px solid #3a4154;background:#1a1f2b;color:#fff;padding:12px;font:inherit;font-size:15px;line-height:1.5}
.answer{background:#1a1f2b;border-radius:12px;padding:14px 16px;margin-top:12px}
.answer h3{margin:0 0 6px;color:#fff;font-size:16px}
.answer ol{padding-left:20px;margin:6px 0 0}
.answer li{margin-bottom:8px;font-size:14px}
.answer li b{color:#fff}
.muted{color:var(--stage-mute);font-size:13px}
/* ---- Úkol 2: e-shop Trendo (its own look: warm white, cobalt + sale red, Rubik) ---- */
#v-shop{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
#shop{--z-ink:#14171f;--z-mute:#6b7280;--z-line:#e7e5e0;--z-bg:#faf8f4;--z-card:#ffffff;--z-blue:#1d4ed8;--z-red:#e11d2e;--z-yel:#ffd43b;
  background:var(--z-bg);font-family:"Rubik",var(--f-app);color:var(--z-ink)}
#shop button{font-family:inherit}
.z-head{background:var(--z-blue);color:#fff;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.z-row{display:flex;align-items:center;gap:10px}
.z-logo{font-weight:800;font-size:22px;letter-spacing:-.02em;font-style:italic}
.z-wallet{margin-left:auto;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}
.z-cartbtn{border:0;background:#fff;color:var(--z-blue);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.z-search{background:#fff;color:var(--z-mute);border-radius:10px;padding:10px 12px;font-size:14px}
.z-sale{background:var(--z-red);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:8px 10px;letter-spacing:.02em}
.z-sale b{font-variant-numeric:tabular-nums;background:rgba(0,0,0,.2);border-radius:5px;padding:1px 6px;margin-left:4px}
.z-pad{padding:14px}
.z-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.z-bar h2{margin:0;font-size:18px}
.z-sort{border:1px solid var(--z-line);background:#fff;border-radius:8px;padding:7px 8px;font:inherit;font-size:13px;color:var(--z-ink)}
.z-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.z-card{background:var(--z-card);border:0;border-radius:12px;padding:0 0 10px;text-align:left;overflow:hidden;color:var(--z-ink);display:flex;flex-direction:column;gap:4px;position:relative}
.z-img{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:#efece6}
.z-img svg{width:70%;height:70%}
.z-card .nm{font-size:13px;padding:0 10px;line-height:1.3;min-height:34px}
.z-card .pr{padding:0 10px;font-weight:800;font-size:17px;color:var(--z-red)}
.z-card .pr s{color:var(--z-mute);font-weight:400;font-size:12px;margin-left:4px}
.z-card .pr.coin{color:#b7791f}
.z-card .sub{padding:0 10px;font-size:11px;color:var(--z-mute)}
.z-badge{position:absolute;top:8px;left:8px;background:var(--z-red);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:3px 6px}
.z-hot{color:var(--z-red);font-size:11px;font-weight:700;padding:0 10px}
.z-back{border:0;background:none;font-weight:700;font-size:15px;padding:14px 14px 4px;color:var(--z-ink)}
.z-big{aspect-ratio:1/1;max-width:100%;background:#efece6;display:grid;place-items:center}
.z-big svg{width:62%;height:62%}
.z-det{padding:14px;display:flex;flex-direction:column;gap:10px}
.z-det h1{font-size:20px;margin:0}
.z-price{font-size:26px;font-weight:800;color:var(--z-red)}
.z-price s{font-size:14px;color:var(--z-mute);font-weight:400;margin-left:6px}
.z-alert{background:#fff1f2;color:var(--z-red);border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600}
.z-alert b{font-variant-numeric:tabular-nums}
.z-peek{font-size:12px;color:var(--z-mute)}
.z-lab{font-size:13px;font-weight:700;margin-top:4px}
.z-opts{display:flex;flex-wrap:wrap;gap:8px}
.z-opt{border:1.5px solid var(--z-line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;color:var(--z-ink);text-align:left}
.z-opt.on{border-color:var(--z-blue);background:#eef2ff;font-weight:700}
.z-opt small{display:block;font-weight:400;color:var(--z-mute);font-size:11px}
.z-btn{border:0;border-radius:12px;padding:15px;font-weight:800;font-size:15px;background:var(--z-blue);color:#fff;width:100%}
.z-btn.y{background:var(--z-yel);color:var(--z-ink)}
.z-btn[disabled]{opacity:.4}
.z-item{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px}
.z-item .z-img{width:58px;flex:none;border-radius:8px}
.z-item .t{flex:1;min-width:0;font-size:13px}
.z-item .t b{display:block;font-size:14px}

   ["Visual interference (vizuální rušení)",`Velké barevné tlačítko vedlo k dražšímu tarifu, odkaz „Ukončit Premium“ byl malý a šedý až dole. V posledním kroku bylo správné tlačítko „Ano“ téměř neviditelné.`],

  ];
  return `<div class="win">
   <div class="tag">Úkol 1 splněn</div>
   <h1>Předplatné zrušeno!</h1>

reg.addEventListener("click",e=>{

  R.scrollTop=false;
  switch(b.dataset.r){
    case "ckall": R.t.cookies=true; rGo("welcome"); break;
    case "ckset": rGo("ckset"); break;
    case "cksave": R.t.cookies=Object.values(R.ck).some(Boolean); rGo("welcome"); break;

    case "close": R.overlay=null; break;
    case "email": rGo("form"); break;
    case "create":{
      if(!/^\S+@\S+\.\S+$/.test(R.f.email)){rToast("Zadej platný e-mail.");break}
      if(R.f.pass.length<8){rToast("Heslo musí mít alespoň 8 znaků.");break}
      if(!R.f.terms){rToast("Pro registraci je potřeba souhlasit s obchodními podmínkami.");break}

      R.overlay="pro"; break;}
    case "proyes": R.t.pro=true; rGo("contacts"); break;
    case "prono": rGo("contacts"); break;
    case "upload": R.t.contacts=true; rFinish(); break;
    case "skipc": rFinish(); break;
    case "retry": rFresh(true); break;
    case "hub": location.hash="#hub"; return;
  }
  rRender(); rHud();
});

   ["Nagging (otravování)","Místo zrušení aplikace opakovaně nabízela něco jiného: dražší Premium Plus a pak slevu."],
   ["Forced action (vynucená akce)","Před zrušením chtěla telefonní číslo, i když ho nepotřebovala, a k tomu předzaškrtnutý souhlas s reklamními SMS. Šlo to obejít přes „Ověřit jinak“."],
   ["Confirmshaming (zahanbování)","„Ne, díky. Nová hudba mě nebaví.“ a „Ano, chci přijít o všechno, co jsem si vybudoval.“"],
   ["Trick wording (matoucí formulace)","„Nepřejete si, aby vaše předplatné nebylo ukončeno a nedošlo k jeho nepokračování?“ Trojitý zápor, správně bylo „Ano“."],
 ]},
};

function allDone(){return REQUIRED.every(n=>H.done[n])}
function renderTasks(){
  document.getElementById("tasks").innerHTML=TASKS.map(t=>{
    const active=REQUIRED.includes(t.n)||(t.n===3&&H.submitted), done=H.done[t.n], st=H.stats[t.n];
    return `<div class="tcard ${active?"":"off"} ${done?"done":""}">
      <div class="lab"><span>Úkol ${t.n} · ${esc(t.app)}</span>${done?"<b>Splněno ✓</b>":""}</div>
      <h3>${esc(t.title)}</h3><p>${esc(t.text)}</p>
      ${done&&st?`<div class="muted">Čas ${st.time} · ${st.clicks} kliků · nachytáni ${st.caught}×</div>`:""}
      ${active?`<button class="go" data-task="${t.n}">${done?"Zkusit znovu":"Spustit úkol"}</button>`:`<button class="go" disabled>${t.n===3?"Odemkne se s bonusem":"Zatím zamčeno"}</button>`}
    </div>`}).join("");
}
function stepBox(n,title,state,body,lockText){
  return `<div class="step ${state}"><div class="step-h"><div class="step-n">${state==="ok"?"✓":n}</div><h2>${title}</h2></div>${state==="locked"?`<p class="lockmsg">${lockText}</p>`:body}</div>`;
}
function renderSteps(){
  const s1=allDone(), s2=s1&&H.read, s3=s2&&H.checked;
  const read=`<div class="read">
    <p><b style="color:#fff">Dark pattern</b> (temný vzorec, klamavý design) je prvek aplikace nebo webu navržený tak, abys udělal něco, co bys jinak neudělal: zaplatil víc, zůstal déle, dal víc osobních údajů nebo nezrušil předplatné. Nejde o chybu designu, ale o záměr. Funguje to, protože využívá zkratky, které má v hlavě každý.</p>
    <details data-d="levers" ${H.opened&&H.opened.levers&&!H.read?"open":""}><summary>Na jaké páky v nás dark patterns tlačí</summary><div>
    <div class="tbl"><table><thead><tr><th>Páka</th><th>Co dělá</th><th>Konkrétní příklad</th></tr></thead><tbody>
    ${LEVERS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></div></details>
    <details data-d="pats" ${H.opened&&H.opened.pats&&!H.read?"open":""}><summary>Nejčastější dark patterns</summary><div>
    <ul class="pats">${PATTERNS.map(p=>`<li><b>${p[0]}</b><i>${p[1]}</i><br>${p[2]}</li>`).join("")}</ul></div></details>
    <p style="margin-top:16px"><b style="color:#fff">Chceš vědět víc?</b> Další vzorce a skutečné příklady najdeš na <a href="https://deceptive.design/" target="_blank" rel="noopener" style="color:var(--gold)">deceptive.design</a>.</p>
    <p class="muted" style="margin-top:14px">Až budete hledat, ptejte se: Proč to tam je? Co to ve mně vyvolává? Kdo na tom vydělá?</p>
    ${H.read?"":`<button class="hbtn" data-h="read" ${readyToRead()?"":"disabled"}>Přečteno, pokračovat</button>${readyToRead()?"":`<p class="muted" id="readhint" style="margin-top:8px">Nejdřív si rozklikněte a přečtěte obě části výše.</p>`}`}</div>`;
  const ident=`<p>Projděte si klidně znovu všechny aplikace společně s týmem. Dělejte si poznámky na papír a pak sem napište všechno, co jste objevili: co vám bránilo, kde vás aplikace tlačila a jak se tomu říká.</p>
    <div class="field"><label for="notes">Dark patterns, které jsme našli</label>
    <textarea id="notes" placeholder="Např. v Toniku byla reklama, která vypadala jako tlačítko…">${esc(H.notes)}</textarea></div>
    ${H.checked?"":`<button class="hbtn" data-h="check" ${H.notes.trim()?"":"disabled"}>Zkontrolovat</button>`}`;
  const check=`<p>Tohle všechno se v aplikacích schovávalo. Porovnejte to se svými poznámkami.</p>
    ${REQUIRED.map(n=>ANSWERS[n]).map(a=>`<div class="answer"><h3>${a.app}</h3><ol>${a.items.map(([x,y])=>`<li><b>${x}.</b> ${y}</li>`).join("")}</ol></div>`).join("")}
    <div class="field" style="margin-top:18px"><label for="missed">Čeho jste si předtím v týmu nevšimli?</label>
    <textarea id="missed" placeholder="Napište, co vám uniklo a proč myslíte, že to fungovalo." ${H.submitted?"readonly":""}>${esc(H.missed)}</textarea></div>
    ${H.submitted?"":`<button class="hbtn" data-h="submit" ${H.missed.trim()?"":"disabled"}>Odeslat odpověď</button>`}`;
  document.getElementById("step1").innerHTML=
    stepBox(1,"Splňte úkoly 1 a 2",s1?"ok":"",`<p>Splněno ${REQUIRED.filter(n=>H.done[n]).length} ze ${REQUIRED.length} povinných úkolů. Spusťte je z dlaždic níže. Úkol 3 se odemkne jako bonus na konci.</p>`,"");
  document.getElementById("steps").innerHTML=
    stepBox(2,"Přečtěte si něco o dark patterns",!s1?"locked":(H.read?"ok":""),read,"Odemkne se po splnění všech úkolů.")+
    (H.read?`<div class="step ok" style="background:#1f4a3a;border-color:#2f7d5d;text-align:center"><h2 style="font-size:20px">Na dalších úkolech pokračujte společně v týmu.</h2></div>`:"")+
    stepBox(3,"Najděte co nejvíc dark patterns",!s2?"locked":(H.checked?"ok":""),ident,"Odemkne se, až si přečtete text o dark patterns.")+
    stepBox(4,"Zkontrolujte se",!s3?"locked":(H.submitted?"ok":""),check,"Odemkne se po vyplnění poznámek.")+
    (H.submitted?`<div class="step ok" style="background:#1f4a3a;border-color:#2f7d5d;text-align:center"><h2 style="font-size:24px">Dobrá práce, Stanoviště A splněno!</h2></div>
    <div class="step" style="border:1px dashed var(--gold)"><div class="step-h"><div class="step-n" style="background:var(--gold);color:#1d2230;width:36px;height:36px"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" style="display:block"><path fill="#ffffff" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg></div><h2>BONUS: Máš všechno a zbývá ti ještě čas?</h2></div>
    <p style="color:#fff;font-size:18px;font-weight:700;line-height:1.5;margin:4px 0 0">Jaké konkrétní dark patterns používají sociální sítě, které používáš? Najdi příklad dark patternu kdekoliv na internetu nebo přímo ve svém mobilu, popiš, jak funguje, a pořiď o něm důkaz (třeba screenshot).</p>
    <div style="margin-top:18px;background:#1a1f2b;border-radius:12px;padding:16px">
      <p style="margin:0 0 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)">Odemčeno: Úkol 3</p>
      <p style="margin:0">Zkuste se zaregistrovat do aplikace Sešitko tak, abyste jí nedali žádný marketingový souhlas ani údaje navíc.</p>
      <button class="hbtn" data-task="3">Spustit Úkol 3</button>
    </div>
    </div>`:"");
  if(H.read&&!s2){} 
}
function renderHub(){renderTasks();renderSteps()}
document.getElementById("v-hub").addEventListener("click",e=>{
  const t=e.target.closest("[data-task]");
  if(t){const n=t.dataset.task;n==="3"?startReg():n==="2"?startShop():startTonik();return}
  const h=e.target.closest("[data-h]"); if(!h) return;
  if(h.dataset.h==="read"){H.read=true;hSave();renderSteps();document.getElementById("notes")?.focus()}
  if(h.dataset.h==="check"){H.checked=true;hSave();renderSteps()}
  if(h.dataset.h==="submit"){H.submitted=true;hSave();renderHub();document.querySelector(".step.ok[style]")?.scrollIntoView({behavior:"smooth",block:"center"})}
});
function readyToRead(){return !!(H.opened&&H.opened.levers&&H.opened.pats)}
document.getElementById("v-hub").addEventListener("toggle",e=>{
  const d=e.target; if(!d.dataset||!d.dataset.d||!d.open) return;
  H.opened=Object.assign({},H.opened,{[d.dataset.d]:true}); hSave();
  const b=document.querySelector('[data-h="read"]'); if(b&&readyToRead()){b.disabled=false;document.getElementById("readhint")?.remove()}
},true);
document.getElementById("v-hub").addEventListener("input",e=>{
  if(e.target.id==="notes"){H.notes=e.target.value;hSave();const b=document.querySelector('[data-h="check"]');if(b)b.disabled=!H.notes.trim()}
  if(e.target.id==="bonus"){H.bonus=e.target.value;hSave()}
  if(e.target.id==="missed"){H.missed=e.target.value;hSave();const b=document.querySelector('[data-h="submit"]');if(b)b.disabled=!H.missed.trim()}
});
document.getElementById("hubReset").addEventListener("click",()=>{hFresh();hSave();fresh();render();hud();zFresh();zRender();zHud();rFresh();rRender();rHud();renderHub()});

function showView(){
  const v=location.hash==="#tonik"?"tonik":location.hash==="#shop"?"shop":location.hash==="#reg"?"reg":"hub";
  document.getElementById("v-hub").hidden=v!=="hub";
  document.getElementById("v-tonik").hidden=v!=="tonik";
  document.getElementById("v-shop").hidden=v!=="shop";
  document.getElementById("v-reg").hidden=v!=="reg";
  if(v==="hub")renderHub();
  window.scrollTo(0,0);
}
function startTonik(){clearInterval(adTimer);fresh();delete phone.dataset.scr;render();hud();location.hash="#tonik";showView()}
function startReg(){rFresh();rRender();rHud();location.hash="#reg";showView()}
function regWon(){H.done[3]=true;H.stats[3]={time:fmt(R.end-R.start),clicks:R.clicks,caught:R.caught};hSave()}
function startShop(){zFresh();zRender();zHud();location.hash="#shop";showView()}
function shopWon(){H.done[2]=true;H.stats[2]={time:fmt(Z.end-Z.start),clicks:Z.clicks,caught:Z.caught};hSave()}
function tonikWon(){
  const t=S.trap;
  H.done[1]=true;H.stats[1]={time:fmt(S.end-S.start),clicks:S.clicks,caught:t.ad+t.upgrade+t.newsletter+t.phone+t.discount+t.wrong};hSave();
}
window.addEventListener("hashchange",showView);
showView();
</script>
